name: Publicar VetCamp (site próprio)

# Publica o site no Firebase sempre que vetcamp.html ou os arquivos do app mudarem.
# Precisa de dois itens em Settings › Secrets and variables › Actions:
#   FIREBASE_SERVICE_ACCOUNT  -> conteúdo do arquivo JSON da conta de serviço do Firebase
#   FIREBASE_PROJECT_ID       -> o ID do projeto (ex.: samvet-12345)
on:
  push:
    branches: [main, "claude/samvet-sonnet-file-sfo8st"]
    paths: ["vetcamp.html", "app/**", "scripts/build_app.py", "firebase.json", "firestore.rules", "storage.rules"]
  workflow_dispatch:

concurrency:
  group: publicar-vetcamp
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Conferir segredos
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          PROJ: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          if [ -z "$SA" ] || [ -z "$PROJ" ]; then
            echo "::warning::Configure FIREBASE_SERVICE_ACCOUNT e FIREBASE_PROJECT_ID nos segredos do repositório para publicar."
            echo "PULAR=1" >> "$GITHUB_ENV"
          fi
      - name: Gerar o site
        if: env.PULAR != '1'
        run: python3 scripts/build_app.py
      - name: Publicar no Firebase
        if: env.PULAR != '1'
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          PROJ: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          ALVOS="hosting,firestore:rules"
          if grep -q 'storage: *true' app/public/firebase-config.js; then ALVOS="$ALVOS,storage"; fi
          npx --yes firebase-tools@13.29.1 deploy --project "$PROJ" --only "$ALVOS" --non-interactive
          rm -f "$RUNNER_TEMP/sa.json"
