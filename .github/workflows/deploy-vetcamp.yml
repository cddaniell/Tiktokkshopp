name: Publicar VetCamp (site próprio)

# Publica o site no Firebase sempre que vetcamp.html ou os arquivos do app mudarem.
# Precisa de dois itens em Settings › Secrets and variables › Actions:
#   FIREBASE_SERVICE_ACCOUNT  -> conteúdo do arquivo JSON da conta de serviço do Firebase
#   FIREBASE_PROJECT_ID       -> o ID do projeto (ex.: samvet-12345)
on:
  push:
    branches: [main, "claude/samvet-sonnet-file-sfo8st"]
    paths: ["vetcamp.html", "app/**", "scripts/build_app.py", "firebase.json", "firestore.rules", "storage.rules"]
  workflow_dispatch:

concurrency:
  group: publicar-vetcamp
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Conferir segredos
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          PROJ: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          if [ -z "$SA" ] || [ -z "$PROJ" ]; then
            echo "::warning::Configure FIREBASE_SERVICE_ACCOUNT e FIREBASE_PROJECT_ID nos segredos do repositório para publicar."
            echo "PULAR=1" >> "$GITHUB_ENV"
          fi
      - name: Gerar o site
        if: env.PULAR != '1'
        run: python3 scripts/build_app.py
      - name: Conferir a chave
        if: env.PULAR != '1'
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          PROJ: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          python3 - "$RUNNER_TEMP/sa.json" <<'PY'
          import json, os, sys
          try:
              k = json.load(open(sys.argv[1]))
          except Exception:
              print("::error::O segredo FIREBASE_SERVICE_ACCOUNT não é um JSON válido. Cole o conteúdo inteiro do arquivo .json.")
              sys.exit(1)
          chave = k.get("project_id", "?")
          alvo = os.environ["PROJ"].strip()
          # nomes de projeto não são segredo; aparecem com letras separadas para o GitHub não escondê-los
          print("Projeto da chave:  " + " ".join(chave))
          print("Projeto de destino: " + " ".join(alvo))
          if chave != alvo:
              print("::error::A chave é de outro projeto. Gere a chave em Configurações do projeto › Contas de serviço DENTRO do projeto " + " ".join(alvo) + ".")
              sys.exit(1)
          PY
      - name: Publicar o site
        if: env.PULAR != '1'
        env:
          PROJ: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npx --yes firebase-tools@13.29.1 deploy --project "$PROJ" --only hosting --non-interactive
      - name: Publicar as regras de segurança
        if: env.PULAR != '1'
        env:
          PROJ: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          ALVOS="firestore:rules"
          if grep -q 'storage: *true' app/public/firebase-config.js; then ALVOS="$ALVOS,storage"; fi
          npx --yes firebase-tools@13.29.1 deploy --project "$PROJ" --only "$ALVOS" --non-interactive
      - name: Apagar a chave do servidor
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"
