<title>SAMVET</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
/* LAYOUT: barra de couro fixa com abas de seção; lista, agenda, quadro de internação, caixa, estoque, ferramentas e conta; ficha com abas roláveis; formulários em painel.
   COLOUR: marrom couro (marca), marrom claro (fundo, painéis), caramelo para ação. TYPE: Archivo + Atkinson Hyperlegible. */
:root{
 --bg:#f6eee3;--panel:#ecdcc6;--card:#fbf6ef;--line:#d8c1a2;--ink:#33210f;--mute:#76583d;
 --brand:#5b381b;--brandink:#f6e8d4;--act:#965a27;--actink:#ffffff;
 --s-tratamento:#a35400;--s-internado:#b3242c;--s-acompanhamento:#2a5ea8;--s-alta:#2d7445;--s-obito:#6b625a;--warn:#b3242c;--okc:#2d7445;
 --note:#f3e1bf;--shadow:rgb(60 35 15/.14);
 --display:Archivo,"Arial Narrow",system-ui,sans-serif;--body:"Atkinson Hyperlegible",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
 --bg:#1c140e;--panel:#2a1f16;--card:#231a12;--line:#4a3726;--ink:#f2e5d3;--mute:#bfa182;
 --brand:#c49a6c;--brandink:#1c140e;--act:#d99559;--actink:#1c140e;
 --s-tratamento:#f0a75a;--s-internado:#ff8086;--s-acompanhamento:#8db6ff;--s-alta:#78d49c;--s-obito:#b3aaa1;--warn:#ff8086;--okc:#78d49c;
 --note:#3a2a17;--shadow:rgb(0 0 0/.4);color-scheme:dark}}
:root[data-theme="dark"]{
 --bg:#1c140e;--panel:#2a1f16;--card:#231a12;--line:#4a3726;--ink:#f2e5d3;--mute:#bfa182;
 --brand:#c49a6c;--brandink:#1c140e;--act:#d99559;--actink:#1c140e;
 --s-tratamento:#f0a75a;--s-internado:#ff8086;--s-acompanhamento:#8db6ff;--s-alta:#78d49c;--s-obito:#b3aaa1;--warn:#ff8086;--okc:#78d49c;
 --note:#3a2a17;--shadow:rgb(0 0 0/.4);color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 var(--body);overflow-x:clip}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--brand)}
h1,h2,h3{font-family:var(--display);line-height:1.05;margin:0;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:3px solid var(--act);outline-offset:2px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--brand);color:var(--brandink);box-shadow:0 2px 8px var(--shadow)}
.topin{max-width:1100px;margin:0 auto;padding-block:10px 0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.toprow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.top h1{font-size:26px;font-weight:800;letter-spacing:.03em;flex:1}
.top h1 small{display:block;font:400 13px var(--body);letter-spacing:0;opacity:.85}
.who{display:inline-flex;align-items:center;gap:8px;border:1px solid color-mix(in srgb,var(--brandink) 35%,transparent);background:transparent;color:var(--brandink);border-radius:99px;padding:4px 12px 4px 4px;min-height:40px;font-size:14px;font-weight:700}
.who img{width:30px;height:30px;border-radius:50%}
.who .dot{width:10px;height:10px;border-radius:50%;background:var(--brandink);opacity:.5;margin-left:8px}
.nav{display:flex;gap:2px;overflow-x:auto;margin-top:8px;scrollbar-width:none}
.nav button{border:0;background:none;color:var(--brandink);opacity:.78;min-height:42px;padding:0 12px;font-weight:700;border-bottom:3px solid transparent;white-space:nowrap;flex:none}
.nav button[aria-pressed=true]{opacity:1;border-color:var(--brandink)}
.nav .badge{display:inline-block;min-width:20px;padding:0 6px;border-radius:99px;background:var(--brandink);color:var(--brand);font-size:12px;margin-left:4px}
.btn{min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-weight:700;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;text-decoration:none;color:var(--ink)}
.btn.pri{background:var(--act);color:var(--actink);border-color:transparent}
.btn.ghost{background:transparent}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px}
.btn.wa{color:var(--okc)}
.btn[disabled]{opacity:.5;cursor:default}
.wrap{max-width:1100px;margin:0 auto;padding-block:16px 80px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.note{display:none;margin:0 0 12px;padding:10px 14px;border-radius:10px;background:var(--note);font-size:14px}
.note.on{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.counts{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-bottom:12px}
.count{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--card);text-align:left;min-height:64px}
.count b{display:block;font:800 26px var(--display);font-variant-numeric:tabular-nums}
.count span{font-size:13px;color:var(--mute)}
.count[aria-pressed=true]{border-color:currentColor;box-shadow:inset 0 0 0 1px currentColor}
.search{width:100%;min-height:48px;padding:0 14px;border:1px solid var(--line);border-radius:12px;background:var(--card);font-size:16px;margin-bottom:12px}
.row{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:14px;margin-bottom:8px;background:var(--card);width:100%;text-align:left}
.row:hover{background:var(--panel)}
.av{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:var(--panel);font:800 15px var(--display);color:var(--brand);border:2px solid var(--line);flex:none}
.row h3{font-size:18px}
.meta{font-size:14px;color:var(--mute)}
.pill{display:inline-block;padding:3px 10px;border-radius:99px;font-size:13px;font-weight:700;white-space:nowrap;color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent)}
.flag{display:inline-block;font:700 12px var(--body);color:var(--warn);margin-left:6px}
.empty{padding:28px 16px;text-align:center;color:var(--mute);border:2px dashed var(--line);border-radius:16px;margin-bottom:12px}
.empty h2{color:var(--ink);font-size:24px;margin-bottom:8px}
.ag{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;border-bottom:1px solid var(--line)}
.ag>button{display:grid;grid-template-columns:96px minmax(0,1fr);gap:12px;padding:12px 4px;text-align:left;background:none;border:0;width:100%}
.ag>button:hover{background:var(--panel)}
.ag .d{font:800 18px var(--display);white-space:nowrap;font-variant-numeric:tabular-nums}
.ag .d small{display:block;font:700 12px var(--body);color:var(--mute)}
.ag.late .d,.ag.late .d small{color:var(--warn)}
.dayh{font:800 15px var(--display);color:var(--brand);margin:18px 0 4px;text-transform:uppercase;letter-spacing:.06em}
.head{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap;margin:8px 0 14px}
.head .av{width:64px;height:64px;font-size:20px}
.head h2{font-size:clamp(28px,6vw,40px)}
.head .grow{flex:1}
.stsel{min-height:44px;border-radius:10px;border:2px solid var(--c);color:var(--c);background:var(--card);font-weight:700;padding:0 10px}
.tabs{display:flex;gap:2px;overflow-x:auto;border-bottom:2px solid var(--line);margin-bottom:16px;scrollbar-width:thin}
.tab{border:0;background:none;padding:10px 12px;min-height:44px;font-weight:700;color:var(--mute);border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap;flex:none}
.tab[aria-selected=true]{color:var(--ink);border-color:var(--act)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin-bottom:16px}
.vit{background:var(--panel);border-radius:12px;padding:10px 12px}
.vit span{font-size:13px;color:var(--mute);display:block}
.vit b{font:800 22px var(--display);white-space:nowrap;font-variant-numeric:tabular-nums}
.vit small{display:block;font-size:12px;color:var(--mute)}
.vit.out{background:color-mix(in srgb,var(--warn) 12%,transparent)}.vit.out b{color:var(--warn)}
.alert{border-left:4px solid var(--warn);background:color-mix(in srgb,var(--warn) 9%,transparent);padding:10px 14px;border-radius:0 10px 10px 0;margin-bottom:8px}
.info{border-left:4px solid var(--s-acompanhamento);background:color-mix(in srgb,var(--s-acompanhamento) 9%,transparent);padding:10px 14px;border-radius:0 10px 10px 0;margin-bottom:8px}
.box{border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;background:var(--card)}
.box h3{font-size:16px;margin-bottom:8px}
.box p{margin:0 0 6px;white-space:pre-wrap}
.lbl{font-size:13px;font-weight:700;color:var(--mute);display:block}
.fig{position:relative;height:170px}.fig>svg{position:absolute;inset:0;width:100%;height:100%}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.bar h3,.bar h2{font-size:20px}
.hint{font-size:13px;color:var(--mute);margin:-4px 0 12px}
.item{border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px;background:var(--card)}
.item header{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:6px}
.item h3{font-size:17px}
.item .vl{font-size:14px;color:var(--mute);margin-bottom:6px}
.item p{margin:0 0 8px;white-space:pre-wrap}
.btns{display:flex;gap:6px;flex-wrap:wrap}
.late{color:var(--warn);font-weight:700}
.ok{color:var(--okc);font-weight:700}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse}
td,th{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:13px;color:var(--mute)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.calc .f{margin-bottom:10px}
.res{font:800 24px var(--display);color:var(--brand);font-variant-numeric:tabular-nums}
.res small{font:400 14px var(--body);color:var(--mute);display:block}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.thumb{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card)}
.thumb img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;max-width:100%}
.thumb .ph{aspect-ratio:4/3;display:grid;place-items:center;background:var(--panel);font:800 20px var(--display);color:var(--brand)}
.thumb div.t{padding:8px;font-size:13px}
.sheet{position:fixed;inset:0;z-index:20;background:rgb(0 0 0/.45);display:none;align-items:flex-end;justify-content:center}
.sheet.on{display:flex}
.card{background:var(--bg);width:min(720px,100%);max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding-block:18px calc(24px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media(min-width:700px){.sheet{align-items:center}.card{border-radius:18px;padding-left:24px;padding-right:24px}}
.card h2{font-size:24px;margin-bottom:12px}
.f{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 12px}
.fld{grid-column:span 2}.fld.h{grid-column:span 1}
.sec{grid-column:span 2;font-size:15px;color:var(--brand);border-top:1px solid var(--line);padding-top:12px;margin-top:4px}
.fld>label{font-size:14px;font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:6px;margin-bottom:4px}
.fld input:not([type=checkbox]),.fld select,.fld textarea{width:100%;min-height:44px;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);font-size:16px}
.fld textarea{min-height:84px;resize:vertical}
textarea.doc{width:100%;min-height:340px;font:15px/1.5 var(--body);padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
.ck{display:flex;flex-wrap:wrap;gap:6px}
.ck label{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:99px;padding:6px 12px;min-height:40px;font-size:14px;background:var(--card)}
.ck input{width:18px;height:18px;accent-color:var(--act)}
.mic{border:1px solid var(--line);background:var(--card);border-radius:99px;min-height:32px;padding:0 10px;font-size:13px;font-weight:700}
.mic.on{background:var(--act);color:var(--actink)}
.acts{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.acts .del{margin-right:auto;color:var(--warn)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
.steps{margin:0;padding-left:20px}.steps li{margin-bottom:6px}
.link{font-family:ui-monospace,monospace;font-size:14px;background:var(--panel);padding:8px 10px;border-radius:8px;word-break:break-all;user-select:all}

const modVis=(m,p)=>spOk(m.sp,p)&&(!m.fem||p.sexo==='Fêmea')&&(!m.show||m.show(p)||(p[m.key]||[]).length);
const campos=(fs,p)=>fs.filter(f=>spOk(f.sp,p));
const saldo=x=>x.sit==='Orçamento'?0:Math.max(0,num(x.total)-num(x.pago));

const note=(t,btn)=>{$('note').innerHTML=t?`<span>${esc(t)}</span>${btn||''}`:'';$('note').classList.toggle('on',!!t)};
let tt;const toast=t=>{$('toast').textContent=t;$('toast').classList.add('on');clearTimeout(tt);tt=setTimeout(()=>$('toast').classList.remove('on'),2400)};
const cur=()=>S.pac.find(p=>p.id===S.sel);
const idade=n=>{if(!n)return'';const a=new Date(n),h=new Date();let m=(h.getFullYear()-a.getFullYear())*12+h.getMonth()-a.getMonth();if(h.getDate()<a.getDate())m--;if(m<0)return'';return m<12?m+(m===1?' mês':' meses'):Math.floor(m/12)+(m<24?' ano':' anos')+(m%12?' e '+m%12+' m':'')};
const ord=(l,k='data')=>[...(l||[])].sort((a,b)=>((b[k]||'')+(b.hora||'')).localeCompare((a[k]||'')+(a.hora||'')));
const ult=p=>ord(p.consultas);
const ativo=p=>!['alta','obito'].includes(p.status);
const gestacao=p=>{const r=ord(p.repro).find(x=>x.resultado||['Parto','Aborto'].includes(x.evento));return r&&r.resultado==='Prenhe'&&r.parto?r:null};
const proxMed=m=>{const a=m.aplic||[];if(!a.length)return null;return new Date(new Date(a[a.length-1]).getTime()+(+m.freq||0)*36e5)};
const medAtiva=m=>!m.fim||m.fim>=hoje();
const pesoAtual=p=>{const c=ult(p).find(c=>c.peso);return c?num(c.peso):0};

function pendencias(p){
  const out=[],add=(d,txt,tab,warn=0,h='')=>d&&out.push({d,txt,tab,warn,p,h});
  if(ativo(p)){const r=ult(p)[0];if(r&&r.retorno)add(r.retorno,'Retorno','consultas')}
  for(const a of (p.agend||[]))if(['Agendado','Confirmado'].includes(a.situacao))add(a.data,a.tipo+(a.situacao==='Confirmado'?' (confirmado)':'')+(a.local?' · '+a.local:''),'agend',0,a.hora||'');
  const ultPor=(l,k)=>{const m={};for(const x of ord(l))if(!m[x[k]])m[x[k]]=x;return Object.values(m)};
  for(const v of ultPor(p.vacinas,'nome'))if(v.prox)add(v.prox,(v.tipo==='Vacina'?'Vacina: ':v.tipo==='Vermífugo'?'Vermífugo: ':'OPG: ')+v.nome,'vacinas');
  for(const k of ['locomotor','odonto','casco']){const m=MODS.find(x=>x.key===k);if(!modVis(m,p))continue;const x=ord(p[k])[0];if(x&&x.prox)add(x.prox,{locomotor:'Reavaliação locomotora',odonto:'Revisão odontológica',casco:'Casco / ferrageamento'}[k],k)}
  if(spOk('gr',p))for(const x of ultPor(p.oficiais,'tipo'))if(x.resultado==='Negativo'&&x.data&&+x.val)add(addD(x.data,+x.val),x.tipo.split(' (')[0]+' vence','oficiais',10);
  const g=gestacao(p);if(g)add(g.parto,'Parto previsto','repro',15);
  for(const f of (p.fin||[]))if(f.venc&&saldo(f)>0)add(f.venc,'Cobrança: '+f.desc+' · '+R$(saldo(f)),'fin');
  return out;
}
function alertas(p){
  const a=pendencias(p).filter(x=>x.tab!=='agend'&&x.tab!=='fin'&&dias(x.d)<=(x.warn||0)).map(x=>x.txt+' · '+quando(x.d));
  for(const m of (p.meds||[]).filter(medAtiva)){const n=proxMed(m);if(n&&n<new Date())a.unshift('Medicação atrasada: '+m.med)}
  return a;
}

const LS={get:(k,d)=>{try{return JSON.parse(localStorage.getItem(k)||'null')??d}catch(e){return d}},set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const errMsg=e=>e&&e.code==='invalid_argument'?'Você não tem permissão para editar.':e&&e.code==='quota_exceeded'?'Limite de armazenamento atingido.':'Não salvou. Tente de novo.';
function gravar(col,obj,arr){
  obj.atualizado=Date.now();
  const i=arr.findIndex(x=>x.id===obj.id);i<0?arr.push(obj):arr[i]=obj;
  if(!db){LS.set(col==='pacientes'?'prontuario-vet':'samvet-'+col,arr);render();return Promise.resolve()}
  render();
  const body=JSON.parse(JSON.stringify(obj));delete body.id;
  const k=col+'/'+obj.id;
  queue[k]=(queue[k]||Promise.resolve()).then(()=>db.collection(col).doc(obj.id).set(body)).catch(e=>toast(errMsg(e)));
  return queue[k];
}
function apagar(col,id){
  if(col==='pacientes'){S.pac=S.pac.filter(x=>x.id!==id);S.sel=null}else S.est=S.est.filter(x=>x.id!==id);
  if(!db){LS.set(col==='pacientes'?'prontuario-vet':'samvet-'+col,col==='pacientes'?S.pac:S.est);render();return}
  db.collection(col).doc(id).delete().catch(()=>toast('Não foi possível excluir.'));render();
}
const salvar=p=>gravar('pacientes',p,S.pac);
const salvarEst=it=>gravar('estoque',it,S.est);
function salvarCfg(c){S.cfg=c;if(!db){LS.set('samvet-config',c);render();return}db.doc('config/clinica').set(c).then(()=>toast('Dados da clínica salvos')).catch(e=>toast(errMsg(e)));render()}

const VIEWS=[['pac','Pacientes'],['agenda','Agenda'],['intern','Internação'],['caixa','Caixa'],['estoque','Estoque'],['ferr','Ferramentas'],['conta','Conta']];
function renderNav(){
  const n={agenda:S.pac.filter(p=>p.status!=='obito').flatMap(pendencias).filter(x=>dias(x.d)<=0&&x.tab!=='fin').length,
    intern:S.pac.filter(p=>p.status==='internado').length,
    estoque:S.est.filter(estAlerta).length};
  $('nav').innerHTML=VIEWS.map(([k,l])=>`<button data-vis="${k}" aria-pressed="${!S.sel&&S.vis===k}">${l}${n[k]?`<span class="badge">${n[k]}</span>`:''}</button>`).join('');
}
function render(){
  renderNav();
  const p=cur();$('view').hidden=!!p;$('ficha').hidden=!p;
  if(p)return renderFicha(p);
  ({pac:renderLista,agenda:renderAgenda,intern:renderIntern,caixa:renderCaixa,estoque:renderEstoque,ferr:renderFerr,conta:renderConta})[S.vis]();
}
const avatar=p=>`<span class="av">${esc((p.especie||'?').slice(0,2))}</span>`;

function renderLista(){
  const inF=(p,k)=>k==='todos'?ativo(p):k==='grandes'?GR.includes(p.especie)&&ativo(p):p.status===k;
  const q=S.q.toLowerCase();
  const list=S.pac.filter(p=>inF(p,S.filtro)&&(!q||[p.nome,p.tutor,p.raca,p.chip,p.especie,p.prop,p.registro,p.lote,p.coprop,p.treinador].join(' ').toLowerCase().includes(q)))
    .map(p=>({p,a:alertas(p)})).sort((x,y)=>y.a.length-x.a.length||(y.p.atualizado||0)-(x.p.atualizado||0));
  let rows;
  if(!S.pac.length)rows=`<div class="empty"><h2>Nenhum paciente ainda</h2><p>Cadastre o primeiro animal para abrir a ficha clínica.</p><button class="btn pri" data-novo>+ Novo paciente</button></div>`;
  else if(!list.length)rows=`<div class="empty"><p>Nenhum paciente neste filtro.</p></div>`;
  else rows=list.map(({p,a})=>{const u=ult(p)[0];const deb=(p.fin||[]).reduce((s,x)=>s+saldo(x),0);return`<button class="row" data-id="${esc(p.id)}">${avatar(p)}<span><h3>${esc(p.nome)}${a.slice(0,2).map(x=>`<span class="flag">● ${esc(x)}</span>`).join('')}</h3><span class="meta">${esc([p.especie,p.raca,p.categoria,idade(p.nasc)].filter(Boolean).join(' · '))}<br>${esc(p.tutor||'—')}${p.prop?' · '+esc(p.prop):''}${u?' · Última: '+br(u.data):''}${deb?` · <span class="late">deve ${R$(deb)}</span>`:''}</span></span><span class="end"><span class="pill" style="--c:var(--s-${esc(p.status||'tratamento')})">${stLabel(p.status)}</span></span></button>`}).join('');
  const hj=new Date(),hr=hj.getHours(),nm=(me&&me.name||S.cfg.vet||'').split(' ')[0];

function resumo(p){

  const vit=[['Peso',u.peso,'kg'],['Temp.',u.temp,'°C','temp'],['FC',u.fc,'bpm','fc'],['FR',u.fr,'mpm','fr'],['TPC',u.tpc,'s'],['Mucosas',u.mucosas,'']];
  if(spOk('eq',p)&&u.dor)vit.push(['Dor',u.dor,'']);if(spOk('rum',p)&&u.rumen)vit.push(['Rúmen',u.rumen,'/2min']);

  const g=gestacao(p),meds=(p.meds||[]).filter(medAtiva),pend=pendencias(p).sort((a,b)=>a.d.localeCompare(b.d)).slice(0,6);

  const deb=(p.fin||[]).reduce((s,x)=>s+saldo(x),0);
  const car=(p.meds||[]).filter(m=>+m.carencia&&(m.fim||m.inicio)).map(m=>({m,ate:addD(m.fim||m.inicio,+m.carencia)})).filter(x=>dias(x.ate)>=0);
  return `${p.alergias?`<div class="alert"><b>Alergias:</b> ${esc(p.alergias)}</div>`:''}
  ${alertas(p).map(a=>`<div class="alert"><b>${esc(a)}</b></div>`).join('')}
  ${car.map(x=>`<div class="alert">Em carência de <b>${esc(x.m.med)}</b> até ${br(x.ate)}</div>`).join('')}
  ${g?`<div class="info"><b>Prenhe</b> · parto previsto ${br(g.parto)} (${quando(g.parto)})</div>`:''}
  ${deb?`<div class="info">Saldo em aberto: <b>${R$(deb)}</b> <button class="btn sm" data-tab="fin">Ver financeiro</button></div>`:''}
  ${spOk('gr',p)&&Object.keys(ofi).length?`<div class="chips">${Object.values(ofi).map(x=>{const v=x.resultado==='Negativo'&&x.data&&+x.val?addD(x.data,+x.val):null;const c=x.resultado==='Positivo'?'internado':!v?'obito':dias(v)<0?'internado':dias(v)<=10?'tratamento':'alta';return`<span class="pill" style="--c:var(--s-${c})">${esc(x.tipo.split(' (')[0])}: ${esc(x.resultado)}${v?' · até '+br(v):''}</span>`}).join('')}</div>`:''}
  <div class="bar"><h3>Último exame${u.data?' · '+br(u.data):''}</h3><div class="btns"><button class="btn sm" data-add="agend">Agendar</button><button class="btn pri sm" data-add="consultas">+ Nova consulta</button></div></div>
  ${u.data?`<div class="grid">${vit.map(([l,v,un,k])=>`<div class="vit${out(k,v)?' out':''}"><span>${l}</span><b>${v?esc(v)+(un?' '+un:''):'—'}</b>${k&&R[k]?`<small>ref. ${R[k][0]}–${R[k][1]}</small>`:''}</div>`).join('')}</div>`:'<div class="empty"><p>Nenhuma consulta registrada.</p></div>'}
  ${u.diag?`<div class="box"><span class="lbl">Diagnóstico atual</span><p>${esc(u.diag)}</p>${u.trat?`<span class="lbl">Tratamento</span><p>${esc(u.trat)}</p>`:''}</div>`:''}
  ${meds.length?`<div class="box"><h3>Medicação em curso</h3>${meds.map(m=>{const n=proxMed(m);return`<p>${esc(m.med)} ${esc(m.dose||'')} ${esc(m.via||'')} a cada ${esc(m.freq||'?')} h · <span class="${n&&n<new Date()?'late':''}">${n?'próxima '+hora(n.toISOString()):'sem aplicação registrada'}</span></p>`}).join('')}</div>`:''}
  ${pend.length?`<div class="box"><h3>Próximas datas</h3>${pend.map(x=>`<p class="${dias(x.d)<0?'late':''}">${br(x.d)}${x.h?' '+esc(x.h):''} · ${esc(x.txt)} <span class="meta">(${quando(x.d)})</span></p>`).join('')}</div>`:''}

const fmt=(f,v)=>Array.isArray(v)?v.join(', '):f.t==='date'?br(v):v;
const vazio=v=>v===undefined||v===null||v===''||(Array.isArray(v)&&!v.length);
function modulo(m,p){
  const fs=campos(m.f,p).filter(f=>f.k),dk=m.dateK||'data';
  const l=ord(p[m.key],dk);
  let topo='';
  if(m.key==='fin'){const t=l.reduce((s,x)=>s+(x.sit==='Orçamento'?0:num(x.total)),0),sd=l.reduce((s,x)=>s+saldo(x),0);topo=`<div class="counts"><div class="count"><b>${R$(t)}</b><span>Total lançado</span></div><div class="count" style="color:var(--warn)"><b>${R$(sd)}</b><span>Em aberto</span></div></div>`}
  return `<div class="bar"><h3>${m.titulo}</h3><button class="btn pri sm" data-add="${m.key}">+ ${m.add}</button></div>${m.hint?`<p class="hint">${m.hint}</p>`:''}${topo}`+
  (l.length?l.map(it=>{
    const curto=fs.filter(f=>f.t!=='ta'&&![dk,m.titleK].includes(f.k)&&!vazio(it[f.k])).map(f=>`${f.l.replace(/ \(.*\)$/,'').replace(/^[A-Z](\s\/\s[A-Z])? · /,'')}: ${f.k==='unit'||f.k==='desconto'||f.k==='pago'||f.k==='valor'?R$(it[f.k]):fmt(f,it[f.k])}`);
    const longo=fs.filter(f=>f.t==='ta'&&!vazio(it[f.k]));
    let extra='';
    if(m.key==='meds'){const n=proxMed(it),a=it.aplic||[];extra=`<p><b class="${n&&n<new Date()&&medAtiva(it)?'late':''}">${n?'Próxima dose: '+hora(n.toISOString()):'Nenhuma aplicação registrada'}</b><br><span class="meta">${a.length} aplicação(ões)${a.length?' · última '+hora(a[a.length-1]):''}</span></p><div class="btns">${medAtiva(it)?`<button class="btn pri sm" data-aplic="${esc(it.id)}">Registrar aplicação agora</button>`:''}${a.length?`<button class="btn sm" data-desfaz="${esc(it.id)}">Desfazer última</button>`:''}</div>`}
    if(m.key==='oficiais'&&it.resultado==='Negativo'&&it.data&&+it.val){const v=addD(it.data,+it.val);extra=`<p class="${dias(v)<0?'late':''}">Válido até ${br(v)} (${quando(v)})</p>`}
    if(m.key==='fin')extra=`<p><b>Total ${R$(it.total)}</b> · <span class="${saldo(it)?'late':'ok'}">${saldo(it)?'em aberto '+R$(saldo(it)):it.sit==='Orçamento'?'orçamento':'pago'}</span></p>${saldo(it)?`<button class="btn sm" data-quitar="${esc(it.id)}" data-pid="${esc(p.id)}">Marcar como pago</button>`:''}`;
    if(m.key==='agend')extra=`<div class="btns">${waLink(p.tel,`Olá, ${p.tutor||''}! Aqui é da ${S.cfg.clinica||'SAMVET'}. Confirmando ${it.tipo} de ${p.nome} em ${br(it.data)}${it.hora?' às '+it.hora:''}${it.local?' ('+it.local+')':''}. Pode confirmar?`)}</div>`;
    const tit=m.key==='agend'?`${br(it.data)} ${esc(it.hora||'')} · ${esc(it.tipo)} <span class="pill" style="--c:var(--s-${it.situacao==='Realizado'?'alta':it.situacao==='Confirmado'?'acompanhamento':['Faltou','Cancelado'].includes(it.situacao)?'obito':'tratamento'})">${esc(it.situacao||'')}</span>`:m.key==='evolucao'?`${br(it.data)} ${esc(it.hora||'')} · ${esc(it.turno||'')}`:`${br(it[dk])} · ${m.titleK==='grau'&&it.grau?'Grau ':''}${esc(String(it[m.titleK]||'').split(' – ')[0]||m.tab)}`;
    return `<article class="item"><header><h3>${tit}</h3><button class="btn sm" data-edit="${m.key}" data-iid="${esc(it.id)}">Editar</button></header>
    ${m.titleK==='grau'&&it.grau?`<div class="vl">${esc(it.grau)}</div>`:''}${curto.length?`<div class="vl">${esc(curto.filter(s=>!/^(Hora|Turno|Situação|Tipo): /.test(s)||!['agend','evolucao'].includes(m.key)).join(' · '))}</div>`:''}
    ${longo.map(f=>`<span class="lbl">${f.l}</span><p>${esc(it[f.k])}</p>`).join('')}${extra}</article>`}).join(''):'<div class="empty"><p>Nada registrado ainda.</p></div>');

/* ---------- documentos ---------- */
const DOCS=[['receita','Receituário'],['atestado','Atestado de saúde'],['termo_cir','Termo de consentimento (cirurgia / anestesia)'],['termo_int','Termo de internação'],['termo_euta','Termo de autorização para eutanásia'],['obito','Declaração de óbito'],['encam','Encaminhamento'],['orcamento','Orçamento'],['recibo','Recibo']];
function cabec(){const c=S.cfg;return [c.clinica||'SAMVET',[c.vet,c.crmv?'CRMV '+c.crmv:''].filter(Boolean).join(' · '),[c.endc,c.cidade].filter(Boolean).join(' · '),[c.telc,c.emailc].filter(Boolean).join(' · ')].filter(Boolean).join('\n')}
function identA(p){return `Animal: ${p.nome} · ${[p.especie,p.raca,p.sexo,p.pelagem,idade(p.nasc)].filter(Boolean).join(' · ')}${p.chip?'\nIdentificação: '+p.chip:''}${p.registro?' · Registro: '+p.registro:''}\nTutor: ${p.tutor||''}${p.cpf?' · CPF/CNPJ '+p.cpf:''}${p.tel?' · '+p.tel:''}${p.prop?'\nPropriedade: '+p.prop:''}${p.end?' · '+p.end:''}`}
function assin(){const c=S.cfg;return `\n\n${c.cidade||'________________'}, ${new Date().toLocaleDateString('pt-BR',{day:'numeric',month:'long',year:'numeric'})}.\n\n\n_______________________________\n${c.vet||'Médico(a)-veterinário(a)'}${c.crmv?'\nCRMV '+c.crmv:''}`}
const assTutor=p=>`\n\n_______________________________\n${p.tutor||'Tutor / responsável'}${p.cpf?'\nCPF/CNPJ '+p.cpf:''}`;
function gerarDoc(t,p){
  const u=ult(p)[0]||{},pe=pesoAtual(p),H=cabec()+'\n'+'─'.repeat(24)+'\n\n';
  switch(t){
  case 'receita':{const ms=(p.meds||[]).filter(medAtiva);return H+'RECEITUÁRIO\n\n'+identA(p)+(pe?`\nPeso: ${pe} kg`:'')+'\n\n'+(ms.length?ms.map((m,i)=>`${i+1}) ${m.med}${m.dose?' — '+m.dose:''}\n   Via ${m.via||''}, a cada ${m.freq||'?'} horas${m.fim?', até '+br(m.fim):''}.${m.obs?'\n   '+m.obs:''}${+m.carencia?'\n   Carência: '+m.carencia+' dias.':''}`).join('\n\n'):(u.trat||'1) \n   Via , a cada  horas, por  dias.'))+(u.orient?'\n\nOrientações: '+u.orient:'')+assin()}
  case 'atestado':return H+'ATESTADO DE SAÚDE\n\n'+`Atesto, para os devidos fins, que examinei nesta data o animal abaixo identificado, que se encontra clinicamente sadio, sem sinais de doença infectocontagiosa ou parasitária${u.temp?` (T ${u.temp} °C, FC ${u.fc||'—'} bpm, FR ${u.fr||'—'} mpm)`:''}, apto para ${p.finalidade==='Esporte'?'participar de provas e eventos':'trânsito / a finalidade a que se destina'}.\n\n`+identA(p)+(()=>{const ofi={};for(const x of ord(p.oficiais))if(!ofi[x.tipo])ofi[x.tipo]=x;const l=Object.values(ofi).filter(x=>x.resultado==='Negativo');return l.length?'\n\nExames oficiais: '+l.map(x=>`${x.tipo.split(' (')[0]} negativo em ${br(x.data)}${x.laudo?' (laudo '+x.laudo+')':''}`).join('; ')+'.':''})()+(()=>{const v=ord(p.vacinas).filter(x=>x.tipo==='Vacina').slice(0,6);return v.length?'\nVacinas: '+v.map(x=>`${x.nome} (${br(x.data)})`).join('; ')+'.':''})()+assin();
  case 'termo_cir':return H+'TERMO DE CONSENTIMENTO PARA CIRURGIA E ANESTESIA\n\n'+identA(p)+`\n\nProcedimento: ${u.diag?'tratamento de '+u.diag:'________________________________'}\n\nEu, ${p.tutor||'________________'}, responsável pelo animal acima, autorizo a realização do procedimento cirúrgico e da anestesia/sedação necessárias. Declaro que fui informado(a) sobre o diagnóstico, as alternativas de tratamento, os riscos anestésicos e cirúrgicos (incluindo complicações e óbito), os cuidados pós-operatórios e a estimativa de custos, e que tive oportunidade de esclarecer minhas dúvidas.\n\nAutorizo também procedimentos adicionais que se façam necessários durante a cirurgia, em benefício do animal.\n\nValor estimado: R$ ____________`+assTutor(p)+assin();
  case 'termo_int':return H+'TERMO DE INTERNAÇÃO\n\n'+identA(p)+`\n\nMotivo da internação: ${u.diag||u.queixa||'________________'}\n\nAutorizo a internação do animal acima e os exames, medicações e procedimentos necessários ao tratamento, ciente de que serão cobrados diárias, materiais e medicamentos utilizados. Fui informado(a) do estado clínico e do prognóstico, e de que receberei atualizações pelo telefone ${p.tel||'________'}.\n\nPertences deixados com o animal: ________________________________`+assTutor(p)+assin();
  case 'termo_euta':return H+'TERMO DE AUTORIZAÇÃO PARA EUTANÁSIA\n\n'+identA(p)+`\n\nEu, ${p.tutor||'________________'}, responsável pelo animal acima, declaro ter sido informado(a) de seu estado clínico${u.diag?' ('+u.diag+')':''} e do prognóstico, e autorizo a realização da eutanásia, a ser executada conforme as normas do Conselho Federal de Medicina Veterinária, com métodos que garantam ausência de dor e sofrimento.\n\nDestino do corpo: (  ) cremação  (  ) sepultamento em propriedade  (  ) recolhimento pela clínica  (  ) outro: __________`+assTutor(p)+assin();
  case 'obito':return H+'DECLARAÇÃO DE ÓBITO\n\n'+identA(p)+`\n\nDeclaro que o animal acima identificado veio a óbito em ____/____/______, às ____h____.\nCausa provável: ${u.diag||'________________'}\nCircunstância: (  ) natural  (  ) eutanásia  (  ) outra: __________`+assin();
  case 'encam':return H+'ENCAMINHAMENTO\n\n'+identA(p)+(pe?`\nPeso: ${pe} kg`:'')+`\n\nEncaminho o paciente para: ________________________________\n\nHistórico: ${u.queixa||''}\nAchados: ${u.exame||''}\nSuspeita diagnóstica: ${u.diag||''}\nTratamento realizado: ${u.trat||''}\nMedicações em curso: ${(p.meds||[]).filter(medAtiva).map(m=>m.med+' '+(m.dose||'')).join('; ')||'nenhuma'}\nAlergias: ${p.alergias||'nenhuma conhecida'}`+assin();
  case 'orcamento':case 'recibo':{const l=(p.fin||[]).filter(x=>t==='orcamento'?(x.sit==='Orçamento'||saldo(x)>0):num(x.pago)>0);const tot=l.reduce((s,x)=>s+(t==='orcamento'?num(x.total):num(x.pago)),0);
    return H+(t==='orcamento'?'ORÇAMENTO':'RECIBO')+'\n\n'+identA(p)+'\n\n'+(l.length?l.map(x=>`• ${br(x.data)} ${x.desc} — ${x.qtd||1} × ${R$(x.unit)}${num(x.desconto)?' − '+R$(x.desconto):''} = ${R$(t==='orcamento'?x.total:x.pago)}`).join('\n'):'• ')+`\n\nTOTAL: ${R$(tot)}`+(t==='recibo'?`\n\nRecebi de ${p.tutor||'________'} a importância de ${R$(tot)} referente aos serviços veterinários acima.`:`\n\nOrçamento válido por 15 dias.${S.cfg.pix?'\nChave Pix: '+S.cfg.pix:''}`)+assin()}
  }
}
function docsTab(p){

function abrirDoc(p,titulo,texto,docId){

  <div class="acts">${docId?'<button type="button" class="btn ghost del" id="docdel">Excluir</button>':''}<button class="btn" id="cancel">Fechar</button><button class="btn" id="doccopy">Copiar</button>${dl?'<button class="btn" id="docdl">Baixar</button>':''}${waLink(p.tel,'').replace(/href="[^"]*"/,'id="docwa" href="#"')}<button class="btn pri" id="docsave">Salvar na ficha</button></div>`;
  $('sheet').classList.add('on');
  $('cancel').onclick=fechar;
  $('doccopy').onclick=()=>copiar($('doctxt').value,'Documento copiado');
  if($('docdl'))$('docdl').onclick=()=>baixar(`${titulo} - ${p.nome}.txt`.replace(/[\/\\:*?"<>|]/g,'-'),$('doctxt').value,'text/plain');
  if($('docwa'))$('docwa').onclick=e=>{e.currentTarget.href=`https://wa.me/${telWa(p.tel)}?text=${encodeURIComponent($('doctxt').value)}`};
  $('docsave').onclick=()=>{const d={id:docId||uid(),data:hoje(),titulo,texto:$('doctxt').value};const l=p.docs||[];salvar({...p,docs:docId?l.map(x=>x.id===docId?d:x):[...l,d]});fechar();toast('Documento salvo na ficha')};
  if(docId){let arm=0;$('docdel').onclick=()=>{if(!arm){arm=1;$('docdel').textContent='Toque de novo para excluir';return}salvar({...p,docs:(p.docs||[]).filter(x=>x.id!==docId)});fechar()}}
}

function desenhaPeso(s,p){
  const pts=ult(p).filter(c=>c.peso).reverse().map(c=>({d:c.data,v:+c.peso}));
  const draw=()=>{const W=s.clientWidth,H=s.clientHeight,pad=28;if(!W)return;const vs=pts.map(x=>x.v),mn=Math.min(...vs),mx=Math.max(...vs),r=mx-mn||1;
    const X=i=>pad+i*(W-pad*2)/(pts.length-1),Y=v=>H-pad-(v-mn)/r*(H-pad*2);
    s.innerHTML=`<polyline fill="none" stroke="var(--brand)" stroke-width="3" points="${pts.map((x,i)=>X(i)+','+Y(x.v)).join(' ')}"/>`+pts.map((x,i)=>`<circle cx="${X(i)}" cy="${Y(x.v)}" r="5" fill="var(--act)"/>${W>520||i===0||i===pts.length-1?`<text x="${X(i)}" y="${Y(x.v)-10}" text-anchor="middle" font-size="13" fill="var(--ink)">${esc(x.v)}</text><text x="${X(i)}" y="${H-6}" text-anchor="middle" font-size="12" fill="var(--mute)">${esc(br(x.d).slice(0,5))}</text>`:''}`).join('')};
  const ro=new ResizeObserver(draw);ro.observe(s);
}

/* ---------- formulários ---------- */
function abrirForm(titulo,todos,val,p,onSave,onDel){
  const fs=campos(todos,p);
  const fld=f=>{
    if(f.sec)return `<h3 class="sec">${f.sec}</h3>`;
    const v=val[f.k]??'',id='f_'+f.k;let inp;
    if(f.t==='select')inp=`<select id="${id}">${f.o.map(o=>{const[k,l]=Array.isArray(o)?o:[o,o||'—'];return`<option value="${esc(k)}"${String(v)===k?' selected':''}>${esc(l)}</option>`}).join('')}</select>`;
    else if(f.t==='ta')inp=`<textarea id="${id}">${esc(v)}</textarea>`;
    else if(f.t==='checks')inp=`<div class="ck" id="${id}">${f.o.map(o=>`<label><input type="checkbox" value="${esc(o)}"${(Array.isArray(v)?v:[]).includes(o)?' checked':''}>${esc(o)}</label>`).join('')}</div>`;
    else{const lst=f.listEst?S.est.map(x=>x.nome):typeof f.list==='function'?f.list(p):f.list;
      inp=`<input id="${id}" type="${f.t||'text'}" ${f.t==='number'?'step="any" inputmode="decimal"':''} value="${esc(v)}"${lst&&lst.length?` list="dl_${f.k}"`:''}>${lst&&lst.length?`<datalist id="dl_${f.k}">${lst.map(o=>`<option value="${esc(o)}">`).join('')}</datalist>`:''}`}
    const hint=f.hint2||(f.hint?(f.hint.eq&&spOk('eq',p)?f.hint.eq:f.hint.rum&&spOk('rum',p)?f.hint.rum:''):'');
    return `<div class="fld${f.h?' h':''}"><label for="${id}">${f.l}${f.req?' *':''}${hint?` <span class="meta">${hint}</span>`:''}${f.t==='ta'&&dict?`<button type="button" class="mic" data-mic="${id}">Ditar</button>`:''}</label>${inp}</div>`};
  $('card').innerHTML=`<h2>${esc(titulo)}</h2><form id="frm" novalidate><div class="f">${fs.map(fld).join('')}</div><div class="acts">${onDel?'<button type="button" class="btn ghost del" id="del">Excluir</button>':''}<button type="button" class="btn" id="cancel">Cancelar</button><button class="btn pri">Salvar</button></div></form>`;
  $('sheet').classList.add('on');$('card').scrollTop=0;
  const ler=()=>{const o={...val};for(const f of fs){if(!f.k)continue;const el=$('f_'+f.k);o[f.k]=f.t==='checks'?[...el.querySelectorAll('input:checked')].map(c=>c.value):el.value.trim()}return o};
  for(const f of fs.filter(f=>f.re))$('f_'+f.k).onchange=()=>{const o=ler();abrirForm(titulo,todos,o,{...p,...o},onSave,onDel)};
  $('cancel').onclick=fechar;
  if(onDel){let arm=0;$('del').onclick=()=>{if(!arm){arm=1;$('del').textContent='Toque de novo para excluir';return}onDel();fechar()}}
  $('frm').onsubmit=e=>{e.preventDefault();const o=ler();
    const falta=fs.find(f=>f.req&&!o[f.k]);if(falta){toast('Preencha: '+falta.l);$('f_'+falta.k).focus();return}
    onSave(o);fechar();toast('Salvo')};
}
function fechar(){pararMic();$('sheet').classList.remove('on');render()}
function pararMic(){if(dict&&micBtn)dict.stop().catch(()=>{})}

function editarItem(p,key,id){
  const m=MODS.find(x=>x.key===key),lista=p[key]||[],dk=m.dateK||'data';
  const item=id?lista.find(x=>x.id===id):{id:uid(),[dk]:hoje(),...(m.def?m.def(p):{})};if(!item)return;
  if(!id&&key==='consultas'){const u=ult(p)[0];if(u&&u.retorno&&u.retorno<=hoje())item.tipo='Retorno'}
  abrirForm((id?'Editar · ':'')+(id?m.tab:m.add)+' · '+p.nome,m.f,item,p,o=>{
    if(m.save)m.save(o,p);
    let np={...p,[key]:id?lista.map(x=>x.id===id?o:x):[...lista,o]};
    if(key==='consultas'&&num(o.valor)&&!(p.fin||[]).some(f=>f.ref===o.id)){np.fin=[...(p.fin||[]),{id:uid(),ref:o.id,data:o.data,tipo:'Serviço',desc:o.tipo+(o.diag?' — '+o.diag.slice(0,60):''),qtd:'1',unit:o.valor,total:String(num(o.valor)),sit:'Pendente',pago:''}];toast('Lançado no Financeiro')}
    salvar(np)},
    id?()=>salvar({...p,[key]:lista.filter(x=>x.id!==id)}):null);
}
function textoFicha(p){
  const L=[`${S.cfg.clinica||'SAMVET'} · FICHA CLÍNICA: ${p.nome}`];
  for(const f of campos(F_PAC,p))if(f.k&&!vazio(p[f.k]))L.push(`${f.l}: ${f.k==='status'?stLabel(p.status):fmt(f,p[f.k])}`);
  for(const m of MODS.filter(m=>modVis(m,p))){const l=ord(p[m.key],m.dateK||'data');if(!l.length)continue;L.push('',m.titulo.toUpperCase());
    for(const it of l){L.push('— '+br(it[m.dateK||'data'])+' · '+(it[m.titleK]||''));for(const f of campos(m.f,p))if(f.k&&f.k!==(m.dateK||'data')&&f.k!==m.titleK&&!vazio(it[f.k]))L.push(`${f.l}: ${fmt(f,it[f.k])}`);if(it.aplic&&it.aplic.length)L.push('Aplicações: '+it.aplic.map(hora).join(', '))}}
  return L.join('\n');
}
function copiar(t,ok){navigator.clipboard.writeText(t).then(()=>toast(ok)).catch(()=>toast('Não foi possível copiar. Selecione o texto e copie manualmente.'))}
function baixar(nome,data,tipo){if(!dl){toast('Download indisponível aqui.');return}dl.save({filename:nome,data:new Blob([data],{type:tipo})}).then(r=>{if(r&&r.status==='saved')toast('Arquivo salvo')}).catch(e=>{if(e&&e.code!=='cancelled'&&e.code!=='declined')toast('Não foi possível baixar.')})}
const novoPaciente=()=>{const b={especie:'Equino',sexo:'Macho',castrado:'Não',status:'tratamento'};abrirForm('Novo paciente',F_PAC,b,b,o=>{o.id=uid();o.criado=Date.now();salvar(o);S.sel=o.id;S.tab='resumo'})};
function escolherPaciente(titulo,cb){
  const ps=S.pac.filter(ativo).sort((a,b)=>String(a.nome).localeCompare(String(b.nome)));
  $('card').innerHTML=`<h2>${titulo}</h2>${ps.length?`<input class="search" id="pq" placeholder="Buscar paciente" aria-label="Buscar paciente"><div id="pl">${ps.map(p=>`<button class="row" data-pick="${esc(p.id)}">${avatar(p)}<span><h3>${esc(p.nome)}</h3><span class="meta">${esc(p.tutor||'')}${p.prop?' · '+esc(p.prop):''}</span></span></button>`).join('')}</div>`:'<div class="empty"><p>Cadastre um paciente primeiro.</p></div>'}<div class="acts"><button class="btn" id="cancel">Cancelar</button></div>`;
  $('sheet').classList.add('on');$('cancel').onclick=fechar;
  if($('pq'))$('pq').oninput=e=>{const q=e.target.value.toLowerCase();$('pl').querySelectorAll('[data-pick]').forEach(b=>b.hidden=!b.textContent.toLowerCase().includes(q))};
  $('card').querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>cb(S.pac.find(p=>p.id===b.dataset.pick)));
}

/* ---------- eventos ---------- */
$('novo').onclick=novoPaciente;
$('sheet').addEventListener('click',e=>{if(e.target===$('sheet'))fechar()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('sheet').classList.contains('on'))fechar()});
document.addEventListener('change',e=>{if(e.target.id==='st'){const p=cur();if(p){salvar({...p,status:e.target.value});toast('Status atualizado')}}});
$('fileup').onchange=async e=>{
  const f=e.target.files[0],p=cur();e.target.value='';if(!f||!p||!assets)return;
  toast('Enviando…');
  try{const r=await assets.upload(f);const q=cur()||p;salvar({...q,anexos:[...(q.anexos||[]),{id:uid(),assetId:r.id,nome:f.name,tipo:r.contentType||f.type,data:hoje()}]});toast('Anexo salvo')}
  catch(err){toast(err&&err.message?'Não foi possível anexar: '+err.message:'Não foi possível anexar.')}
};
$('fileimp').onchange=e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);const ps=Array.isArray(d)?d:d.pacientes||[];let n=0;
    for(const p of ps){if(!p||!p.nome)continue;const o={...p,id:p.id||uid()};S.pac=S.pac.filter(x=>x.id!==o.id);salvar(o);n++}
    for(const it of (d.estoque||[])){if(it&&it.nome)salvarEst({...it,id:it.id||uid()})}
    if(d.config&&typeof d.config==='object')salvarCfg({...S.cfg,...d.config});
    toast(n+' paciente(s) importado(s)')}catch(err){toast('Arquivo inválido. Use um backup .json do SAMVET.')}};r.readAsText(f);
};
document.addEventListener('click',e=>{
  const t=e.target.closest('button');if(!t||t.closest('#card')&&t.dataset.pick)return;const d=t.dataset;let p=cur();
  if(d.mic){if(micBtn===t){pararMic();return}pararMic();micBtn=t;micTa=$(d.mic);
    dict.start().catch(err=>{toast(err&&err.code==='not_granted'?'Microfone não autorizado.':'Ditado indisponível.');micBtn=null});return}
  if(d.vis){S.vis=d.vis;S.sel=null;render();scrollTo(0,0)}
  else if(d.f){S.filtro=d.f;renderLista()}
  else if(d.finf){S.finF=d.finf;render()}
  else if(d.aplic&&d.pid){const q=S.pac.find(x=>x.id===d.pid);if(q){salvar({...q,meds:q.meds.map(m=>m.id===d.aplic?{...m,aplic:[...(m.aplic||[]),new Date().toISOString()]}:m)});toast('Aplicação registrada')}}
  else if(d.quitar){const q=S.pac.find(x=>x.id===d.pid);if(!q)return;const f=(q.fin||[]).find(x=>x.id===d.quitar);if(!f)return;
    abrirForm('Receber · '+f.desc,[{k:'pago',l:'Valor recebido (R$)',t:'number',h:1},{k:'forma',l:'Forma de pagamento',t:'select',o:FORMAS,h:1}],{pago:String(num(f.total)),forma:f.forma||'Pix'},q,o=>{const pago=num(o.pago);salvar({...q,fin:q.fin.map(x=>x.id===f.id?{...x,pago:String(pago),forma:o.forma,sit:pago>=num(x.total)?'Pago':'Parcial',dataPag:hoje()}:x)})})}
  else if(d.id){S.sel=d.id;S.tab=d.gotab||'resumo';render();scrollTo(0,0)}
  else if('novo' in d)novoPaciente();
  else if('agendar' in d)escolherPaciente('Agendar para qual paciente?',q=>editarItem(q,'agend',null));
  else if('estnovo' in d)abrirForm('Novo produto',F_EST,{id:uid(),un:'frasco',cat:'Medicamento'},{},o=>salvarEst(o));
  else if(d.estedit){const it=S.est.find(x=>x.id===d.estedit);if(it)abrirForm('Editar produto',F_EST,it,{},o=>salvarEst(o),()=>apagar('estoque',it.id))}
  else if(d.estmv){const it=S.est.find(x=>x.id===d.eid);if(it){salvarEst({...it,qtd:String(Math.max(0,num(it.qtd)+(+d.estmv)))})}}
  else if('lote' in d){const ids=[...document.querySelectorAll('#lt_anim input:checked')].map(i=>i.value),nome=$('lt_nome').value.trim();
    if(!nome){toast('Preencha o produto');$('lt_nome').focus();return}if(!ids.length){toast('Marque ao menos um animal');return}
    const reg={tipo:$('lt_tipo').value,nome,lote:$('lt_lote').value.trim(),data:$('lt_data').value||hoje(),prox:$('lt_prox').value,obs:'Atendimento em lote'},val=num($('lt_valor').value);
    for(const id of ids){const q=S.pac.find(x=>x.id===id);if(!q)continue;const np={...q,vacinas:[...(q.vacinas||[]),{...reg,id:uid()}]};if(val)np.fin=[...(q.fin||[]),{id:uid(),data:reg.data,tipo:'Serviço',desc:reg.tipo+': '+nome,qtd:'1',unit:String(val),total:String(val),sit:'Pendente',pago:''}];salvar(np)}
    toast(`Registrado em ${ids.length} animal(is)`)}
  else if('copylink' in d)copiar(LINK,'Link copiado');
  else if('backup' in d)baixar(`samvet-backup-${hoje()}.json`,JSON.stringify({app:'SAMVET',data:new Date().toISOString(),pacientes:S.pac,estoque:S.est,config:S.cfg},null,1),'application/json');
  else if('importar' in d)$('fileimp').click();
  else if('back' in d){S.sel=null;render()}
  else if(d.tab&&p){S.tab=d.tab;render()}
  else if(!p)return;
  else if(d.add)editarItem(p,d.add,null);
  else if(d.edit)editarItem(p,d.edit,d.iid);
  else if(d.aplic){salvar({...p,meds:p.meds.map(m=>m.id===d.aplic?{...m,aplic:[...(m.aplic||[]),new Date().toISOString()]}:m)});toast('Aplicação registrada')}
  else if(d.desfaz){salvar({...p,meds:p.meds.map(m=>m.id===d.desfaz?{...m,aplic:(m.aplic||[]).slice(0,-1)}:m)})}
  else if('editp' in d)abrirForm('Dados do paciente',F_PAC,p,p,o=>salvar(o),()=>apagar('pacientes',p.id));
  else if('copy' in d)copiar(textoFicha(p),'Ficha copiada');
  else if('baixarficha' in d)baixar(`Ficha ${p.nome}.txt`.replace(/[\/\\:*?"<>|]/g,'-'),textoFicha(p),'text/plain');
  else if('upload' in d)$('fileup').click();
  else if(d.rmanexo){salvar({...p,anexos:(p.anexos||[]).filter(a=>a.id!==d.rmanexo)});toast('Anexo removido da ficha')}
  else if(d.gerdoc){const l=DOCS.find(x=>x[0]===d.gerdoc);abrirDoc(p,l[1],gerarDoc(d.gerdoc,p))}
  else if(d.verdoc){const x=(p.docs||[]).find(y=>y.id===d.verdoc);if(x)abrirDoc(p,x.titulo,x.texto,x.id)}
});

function renderWho(){
  const w=$('who');
  if(db&&me){w.innerHTML=`<img src="${esc(me.avatarUrl)}" alt=""><span></span>`;w.querySelector('span').textContent=(me.name||'Conectado').split(' ')[0]}
  else w.innerHTML='<span class="dot"></span>Entrar';
}

render();
(async()=>{
  const use=n=>window.claude&&window.claude.use?window.claude.use(n).catch(()=>null):Promise.resolve(null);
  [db,dict,user,assets,dl]=await Promise.all([use('db'),use('dictation'),use('user'),use('assets'),use('downloads')]);
  if(user){try{me=await user.me()}catch(e){me=null}}
  renderWho();
  if(dict){
    dict.onState(({state})=>{if(micBtn){micBtn.classList.toggle('on',state==='listening');micBtn.textContent=state==='listening'?'Parar':'Ditar';if(state==='idle')micBtn=null}});
    dict.onFinal(({text})=>{if(micTa&&text)micTa.value=(micTa.value?micTa.value.replace(/\s*$/,' '):'')+text});
  }
  if(!db){
    S.pac=LS.get('prontuario-vet',[]);S.est=LS.get('samvet-estoque',[]);S.cfg=LS.get('samvet-config',{});
    note('Modo local: os dados ficam só neste navegador. Entre na sua conta Claude para acessar de qualquer aparelho.','<button class="btn sm" data-vis="conta">Como entrar</button>');render();return}
  note('Carregando pacientes…');
  timer=setTimeout(()=>note('Não foi possível carregar os dados ainda. Verifique a conexão.'),10000);
  const idle=()=>!$('sheet').classList.contains('on');
  db.collection('pacientes').onSnapshot(snap=>{
    if(!snap.metadata.fromCache){clearTimeout(timer);note('')}
    S.pac=snap.docs.map(d=>({...d.data(),id:d.id}));
    if(S.sel&&!cur())S.sel=null;
    if(idle()&&!(document.activeElement&&document.activeElement.closest&&document.activeElement.closest('#view .calc,#view #cfgf,#view .box input')))render();
  },e=>{clearTimeout(timer);note('Erro ao carregar os dados ('+e.code+').')});
  db.collection('estoque').onSnapshot(snap=>{S.est=snap.docs.map(d=>({...d.data(),id:d.id}));if(idle()&&S.vis==='estoque'&&!S.sel)render();else renderNav()},()=>{});
  db.doc('config/clinica').onSnapshot(s=>{S.cfg=s.exists?(s.data()||{}):{};if(idle()&&S.vis==='conta'&&!S.sel&&!(document.activeElement&&document.activeElement.closest('#cfgf')))render()},()=>{});
  setInterval(()=>{if(idle()&&['pac','agenda','intern'].includes(S.vis)||S.sel&&idle())render()},60000);
})();
}
</script>
