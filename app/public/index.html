<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#5b381b">
<meta name="description" content="VetCamp: prontuário veterinário para equinos, grandes e pequenos animais.">
<link rel="manifest" href="manifest.webmanifest">

<link rel="apple-touch-icon" href="icons/icon-180.png">

<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html,body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>VetCamp</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
/* LAYOUT: barra de couro fixa com abas de seção; lista, agenda, quadro de internação, caixa, estoque, ferramentas e conta; ficha com abas roláveis; formulários em painel.
   COLOUR: marrom couro (marca), marrom claro (fundo, painéis), caramelo para ação. TYPE: Archivo + Atkinson Hyperlegible. */
:root{
 --bg:#f6eee3;--panel:#ecdcc6;--card:#fbf6ef;--line:#d8c1a2;--ink:#33210f;--mute:#76583d;
 --brand:#5b381b;--brandink:#f6e8d4;--bar:#5b381b;--barink:#f6e8d4;--act:#965a27;--actink:#ffffff;
 --s-tratamento:#a35400;--s-internado:#b3242c;--s-acompanhamento:#2a5ea8;--s-alta:#2d7445;--s-obito:#6b625a;--warn:#b3242c;--okc:#2d7445;
 --note:#f3e1bf;--shadow:rgb(60 35 15/.14);
 --display:Archivo,"Arial Narrow",system-ui,sans-serif;--body:"Atkinson Hyperlegible",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
 --bg:#1c140e;--panel:#2a1f16;--card:#231a12;--line:#4a3726;--ink:#f2e5d3;--mute:#bfa182;
 --brand:#c49a6c;--brandink:#1c140e;--bar:#3a2414;--barink:#e8c9a0;--act:#d99559;--actink:#1c140e;
 --s-tratamento:#f0a75a;--s-internado:#ff8086;--s-acompanhamento:#8db6ff;--s-alta:#78d49c;--s-obito:#b3aaa1;--warn:#ff8086;--okc:#78d49c;
 --note:#3a2a17;--shadow:rgb(0 0 0/.4);color-scheme:dark}}
:root[data-theme="dark"]{
 --bg:#1c140e;--panel:#2a1f16;--card:#231a12;--line:#4a3726;--ink:#f2e5d3;--mute:#bfa182;
 --brand:#c49a6c;--brandink:#1c140e;--bar:#3a2414;--barink:#e8c9a0;--act:#d99559;--actink:#1c140e;
 --s-tratamento:#f0a75a;--s-internado:#ff8086;--s-acompanhamento:#8db6ff;--s-alta:#78d49c;--s-obito:#b3aaa1;--warn:#ff8086;--okc:#78d49c;
 --note:#3a2a17;--shadow:rgb(0 0 0/.4);color-scheme:dark}
*{box-sizing:border-box;min-width:0}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 var(--body);overflow-x:clip}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bar)}
h1,h2,h3{font-family:var(--display);line-height:1.05;margin:0;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:3px solid var(--act);outline-offset:2px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bar);color:var(--barink);box-shadow:0 2px 8px var(--shadow)}
.topin{max-width:1100px;margin:0 auto;padding-block:10px 0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.toprow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.top h1{font-size:26px;font-weight:800;letter-spacing:.03em;flex:1;white-space:nowrap}
.top h1 small{display:block;font:400 13px var(--body);letter-spacing:0;opacity:.85}
.who{display:inline-flex;align-items:center;gap:8px;border:1px solid color-mix(in srgb,var(--barink) 35%,transparent);background:transparent;color:var(--barink);border-radius:99px;padding:4px 12px 4px 4px;min-height:40px;font-size:14px;font-weight:700}
.who img{width:30px;height:30px;border-radius:50%;flex:none}
.who .wn{max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who .dot{width:10px;height:10px;border-radius:50%;background:var(--barink);opacity:.5;margin-left:8px}
.nav{display:flex;gap:2px;overflow-x:auto;margin-top:8px;scrollbar-width:none}
.nav button{border:0;background:none;color:var(--barink);opacity:.78;min-height:42px;padding:0 12px;font-weight:700;border-bottom:3px solid transparent;white-space:nowrap;flex:none}
.nav button[aria-pressed=true]{opacity:1;border-color:var(--barink)}
.nav .badge{display:inline-block;min-width:20px;padding:0 6px;border-radius:99px;background:var(--barink);color:var(--bar);font-size:12px;margin-left:4px}
.btn{min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-weight:700;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;text-decoration:none;color:var(--ink)}
.btn.pri{background:var(--act);color:var(--actink);border-color:transparent}
.btn.ghost{background:transparent}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px}
.btn.wa{color:var(--okc)}
.btn[disabled]{opacity:.5;cursor:default}
.wrap{max-width:1100px;margin:0 auto;padding-block:16px 80px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.note{display:none;margin:0 0 12px;padding:10px 14px;border-radius:10px;background:var(--note);font-size:14px}
.note.on{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.counts{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-bottom:12px}
.count{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--card);text-align:left;min-height:64px}
.count b{display:block;font:800 26px var(--display);font-variant-numeric:tabular-nums}
.count span{font-size:13px;color:var(--mute)}
.count[aria-pressed=true]{border-color:currentColor;box-shadow:inset 0 0 0 1px currentColor}
.search{width:100%;min-height:48px;padding:0 14px;border:1px solid var(--line);border-radius:12px;background:var(--card);font-size:16px;margin-bottom:12px}
.row{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:14px;margin-bottom:8px;background:var(--card);width:100%;text-align:left}
.row:hover{background:var(--panel)}
.av{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:var(--panel);font:800 15px var(--display);color:var(--brand);border:2px solid var(--line);flex:none;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.fotobtn{position:relative;border:0;background:none;padding:0;border-radius:50%;flex:none}
.fotobtn .cam{position:absolute;left:50%;bottom:-6px;transform:translateX(-50%);background:var(--act);color:var(--actink);font-size:11px;font-weight:700;padding:1px 7px;border-radius:99px;white-space:nowrap}
.fotobtn.grande .av{width:88px;height:88px;font-size:30px}
.perfil{display:flex;gap:18px;align-items:center;flex-wrap:wrap}.perfil .grow{flex:1 1 220px}
.mini{width:26px;height:26px;border-radius:50%;object-fit:cover;vertical-align:-7px;margin-right:6px}
.who img{object-fit:cover}
.row h3{font-size:18px}
.meta{font-size:14px;color:var(--mute)}
.pill{display:inline-block;padding:3px 10px;border-radius:99px;font-size:13px;font-weight:700;white-space:nowrap;color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent)}
.flag{display:inline-block;font:700 12px var(--body);color:var(--warn);margin-left:6px}
.empty{padding:28px 16px;text-align:center;color:var(--mute);border:2px dashed var(--line);border-radius:16px;margin-bottom:12px}
.empty h2{color:var(--ink);font-size:24px;margin-bottom:8px}
.ag{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;border-bottom:1px solid var(--line)}
.ag>button{display:grid;grid-template-columns:96px minmax(0,1fr);gap:12px;padding:12px 4px;text-align:left;background:none;border:0;width:100%}
.ag>button:hover{background:var(--panel)}
.ag .d{font:800 18px var(--display);white-space:nowrap;font-variant-numeric:tabular-nums}
.ag .d small{display:block;font:700 12px var(--body);color:var(--mute)}
.ag.late .d,.ag.late .d small{color:var(--warn)}
.dayh{font:800 15px var(--display);color:var(--brand);margin:18px 0 4px;text-transform:uppercase;letter-spacing:.06em}
.head{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap;margin:8px 0 14px}
.head .av{width:64px;height:64px;font-size:20px}
.head h2{font-size:clamp(28px,6vw,40px)}
.head .grow{flex:1}
.stsel{min-height:44px;border-radius:10px;border:2px solid var(--c);color:var(--c);background:var(--card);font-weight:700;padding:0 10px}
.tabs{display:flex;gap:2px;overflow-x:auto;border-bottom:2px solid var(--line);margin-bottom:16px;scrollbar-width:thin}
.tab{border:0;background:none;padding:10px 12px;min-height:44px;font-weight:700;color:var(--mute);border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap;flex:none}
.tab[aria-selected=true]{color:var(--ink);border-color:var(--act)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin-bottom:16px}
.vit{background:var(--panel);border-radius:12px;padding:10px 12px}
.vit span{font-size:13px;color:var(--mute);display:block}
.vit b{font:800 22px var(--display);white-space:nowrap;font-variant-numeric:tabular-nums}
.vit small{display:block;font-size:12px;color:var(--mute)}
.vit.out{background:color-mix(in srgb,var(--warn) 12%,transparent)}.vit.out b{color:var(--warn)}
.alert{border-left:4px solid var(--warn);background:color-mix(in srgb,var(--warn) 9%,transparent);padding:10px 14px;border-radius:0 10px 10px 0;margin-bottom:8px}
.info{border-left:4px solid var(--s-acompanhamento);background:color-mix(in srgb,var(--s-acompanhamento) 9%,transparent);padding:10px 14px;border-radius:0 10px 10px 0;margin-bottom:8px}
.box{border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;background:var(--card)}
.box h3{font-size:16px;margin-bottom:8px}
.box p{margin:0 0 6px;white-space:pre-wrap}
.lbl{font-size:13px;font-weight:700;color:var(--mute);display:block}
.fig{position:relative;height:170px}.fig>svg{position:absolute;inset:0;width:100%;height:100%}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.bar h3,.bar h2{font-size:20px}
.hint{font-size:13px;color:var(--mute);margin:-4px 0 12px}
.item{border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px;background:var(--card)}
.item header{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:6px}
.item h3{font-size:17px}
.item .vl{font-size:14px;color:var(--mute);margin-bottom:6px}
.item p{margin:0 0 8px;white-space:pre-wrap}
.btns{display:flex;gap:6px;flex-wrap:wrap}
.late{color:var(--warn);font-weight:700}
.ok{color:var(--okc);font-weight:700}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse}
td,th{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:13px;color:var(--mute)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.calc .f{margin-bottom:10px}
.res{font:800 24px var(--display);color:var(--brand);font-variant-numeric:tabular-nums}
.res small{font:400 14px var(--body);color:var(--mute);display:block}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.thumb{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card)}
.thumb img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;max-width:100%}
.thumb .ph{aspect-ratio:4/3;display:grid;place-items:center;background:var(--panel);font:800 20px var(--display);color:var(--brand)}
.thumb div.t{padding:8px;font-size:13px}
.sheet{position:fixed;inset:0;z-index:20;background:rgb(0 0 0/.45);display:none;align-items:flex-end;justify-content:center}
.sheet.on{display:flex}
.card{background:var(--bg);width:min(720px,100%);max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding-block:18px calc(24px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media(min-width:700px){.sheet{align-items:center}.card{border-radius:18px;padding-left:24px;padding-right:24px}}
.card h2{font-size:24px;margin-bottom:12px}
.f{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 12px}
.fld{grid-column:span 2}.fld.h{grid-column:span 1}
.sec{grid-column:span 2;font-size:15px;color:var(--brand);border-top:1px solid var(--line);padding-top:12px;margin-top:4px}
.fld>label{font-size:14px;font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:6px;margin-bottom:4px}
.fld input:not([type=checkbox]),.fld select,.fld textarea{width:100%;min-height:44px;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);font-size:16px}
.fld textarea{min-height:84px;resize:vertical}
textarea.doc{width:100%;min-height:340px;font:15px/1.5 var(--body);padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
.ck{display:flex;flex-wrap:wrap;gap:6px}
.ck label{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:99px;padding:6px 12px;min-height:40px;font-size:14px;background:var(--card)}
.ck input{width:18px;height:18px;accent-color:var(--act)}
.mic{border:1px solid var(--line);background:var(--card);border-radius:99px;min-height:32px;padding:0 10px;font-size:13px;font-weight:700}
.mic.on{background:var(--act);color:var(--actink)}
.acts{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.acts .del{margin-right:auto;color:var(--warn)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
.steps{margin:0;padding-left:20px}.steps li{margin-bottom:6px}
.link{font-family:ui-monospace,monospace;font-size:14px;background:var(--panel);padding:8px 10px;border-radius:8px;word-break:break-all;user-select:all}

<script>
/* VetCamp · versão site próprio.
   Liga o VetCamp ao Firebase (login por e-mail, banco Firestore, arquivos no Storage)
   oferecendo a mesma interface window.claude.use(...) que o app usa dentro do Claude.
   Assim o mesmo vetcamp.html roda nos dois lugares. */
(function(){
  'use strict';
  window.SAMVET_STANDALONE=true;
  const CFG=window.SAMVET_FIREBASE||{};
  const configurado=!!(CFG.apiKey&&CFG.projectId);
  const DEMO=String(CFG.projectId||'').startsWith('demo-');

  /* ---------- tela de login ---------- */
  const css=`
  #auth{position:fixed;inset:0;z-index:100;background:var(--bg,#f6eee3);display:flex;align-items:center;justify-content:center;padding:24px max(16px,env(safe-area-inset-left,0px)) 24px max(16px,env(safe-area-inset-right,0px));overflow:auto}
  #auth[hidden]{display:none!important}
  #auth .ab{width:min(420px,100%);display:grid;gap:14px}
  #auth .alogo{width:96px;height:96px;margin:0 auto;background:var(--brand,#5b381b);-webkit-mask:var(--logo) center/contain no-repeat;mask:var(--logo) center/contain no-repeat}
  #auth h1{font:800 34px Archivo,system-ui,sans-serif;letter-spacing:.04em;text-align:center;margin:0;color:var(--brand,#5b381b)}
  #auth .sub{text-align:center;color:var(--mute,#76583d);margin:-8px 0 4px}
  #auth .tabs2{display:grid;grid-template-columns:1fr 1fr;background:var(--panel,#ecdcc6);border-radius:12px;padding:4px}
  #auth .tabs2 button{border:0;background:none;min-height:42px;border-radius:9px;font-weight:700;color:var(--mute,#76583d)}
  #auth .tabs2 button[aria-pressed=true]{background:var(--card,#fbf6ef);color:var(--ink,#33210f);box-shadow:0 1px 3px rgb(0 0 0/.12)}
  #auth form{display:grid;gap:10px;background:var(--card,#fbf6ef);border:1px solid var(--line,#d8c1a2);border-radius:16px;padding:18px}
  #auth label{font-size:14px;font-weight:700;display:grid;gap:4px}
  #auth input{min-height:46px;padding:8px 12px;border:1px solid var(--line,#d8c1a2);border-radius:10px;background:var(--bg,#f6eee3);font-size:16px;color:inherit}
  #auth .ok2{min-height:48px;border:0;border-radius:10px;background:var(--act,#965a27);color:var(--actink,#fff);font-weight:700;font-size:16px}
  #auth .ok2[disabled]{opacity:.6}
  #auth .lnk{border:0;background:none;color:var(--act,#965a27);font-weight:700;text-decoration:underline;padding:4px;justify-self:center}
  #auth .msg{font-size:14px;border-radius:10px;padding:10px 12px;display:none}
  #auth .msg.on{display:block}#auth .msg.err{background:color-mix(in srgb,var(--warn,#b3242c) 12%,transparent);color:var(--warn,#b3242c)}#auth .msg.inf{background:var(--note,#f3e1bf)}
  #auth .gbtn{display:flex;align-items:center;justify-content:center;gap:10px;min-height:48px;border:1px solid var(--line,#d8c1a2);border-radius:10px;background:#fff;color:#1f1f1f;font-weight:700;font-size:16px}
  #auth .gbtn[disabled]{opacity:.6}
  #auth .ou{display:flex;align-items:center;gap:10px;color:var(--mute,#76583d);font-size:13px}#auth .ou::before,#auth .ou::after{content:"";flex:1;height:1px;background:var(--line,#d8c1a2)}
  #auth .rod{font-size:12px;color:var(--mute,#76583d);text-align:center}#auth .rod a{color:inherit}
  #verifbar{position:sticky;top:0;z-index:6;background:var(--note,#f3e1bf);color:var(--ink,#33210f);font-size:14px;padding:8px max(16px,env(safe-area-inset-left,0px));display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}
  #verifbar button{border:1px solid var(--line,#d8c1a2);background:var(--card,#fbf6ef);border-radius:8px;min-height:34px;padding:0 10px;font-weight:700;color:inherit}`;
  const st=document.createElement('style');st.textContent=css;document.head.appendChild(st);

  const tela=document.createElement('div');tela.id='auth';tela.setAttribute('role','dialog');tela.setAttribute('aria-label','Entrar no VetCamp');
  tela.innerHTML=`<div class="ab"><div class="alogo" aria-hidden="true"></div><h1>VetCamp</h1><p class="sub">Prontuário veterinário · equinos, grandes e pequenos animais</p>
   <div class="tabs2" role="group" aria-label="Entrar ou criar conta"><button type="button" data-m="entrar" aria-pressed="true">Entrar</button><button type="button" data-m="criar" aria-pressed="false">Criar conta</button></div>
   <div class="msg" id="a_msg" role="status"></div>
   <button type="button" class="gbtn" id="a_google"><svg viewBox="0 0 48 48" width="20" height="20" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg><span id="a_gtxt">Entrar com Google</span></button>
   <div class="ou"><span>ou com e-mail e senha</span></div>
   <form id="a_form" novalidate>
    <label id="l_nome" hidden>Seu nome<input id="a_nome" autocomplete="name" placeholder="Como quer ser chamado(a)"></label>
    <label>E-mail<input id="a_email" type="email" autocomplete="email" inputmode="email" required></label>
    <label id="l_senha">Senha<input id="a_senha" type="password" autocomplete="current-password" required minlength="6"></label>
    <label id="l_senha2" hidden>Repita a senha<input id="a_senha2" type="password" autocomplete="new-password"></label>
    <button class="ok2" id="a_ok">Entrar</button>
    <button type="button" class="lnk" id="a_esq">Esqueci minha senha</button>
   </form>
   <p class="rod">Ao criar conta você concorda com a <a href="privacidade.html" target="_blank" rel="noopener">política de privacidade</a>.</p></div>`;
  const montar=()=>{document.body.appendChild(tela);
    // usa a mesma logo da barra do app
    const lg=document.querySelector('.top .logo');if(lg){const m=getComputedStyle(lg).webkitMaskImage||getComputedStyle(lg).maskImage;if(m&&m!=='none')tela.style.setProperty('--logo',m)}};
  if(document.body)montar();else document.addEventListener('DOMContentLoaded',montar);
  const $=id=>document.getElementById(id);
  let modo='entrar',recuperar=false;
  const msg=(t,tipo='err')=>{const m=$('a_msg');m.textContent=t||'';m.className='msg'+(t?' on '+tipo:'')};
  const ERROS={'auth/invalid-email':'E-mail inválido. Confira se digitou certo.','auth/missing-email':'Digite seu e-mail.','auth/user-not-found':'E-mail ou senha incorretos.','auth/wrong-password':'E-mail ou senha incorretos.','auth/invalid-credential':'E-mail ou senha incorretos.','auth/invalid-login-credentials':'E-mail ou senha incorretos.',
    'auth/email-already-in-use':'Já existe uma conta com este e-mail. Toque em Entrar.','auth/weak-password':'A senha precisa ter pelo menos 6 caracteres.','auth/too-many-requests':'Muitas tentativas. Espere alguns minutos e tente de novo.','auth/network-request-failed':'Sem internet. Conecte e tente de novo.','auth/missing-password':'Digite sua senha.',
    'auth/operation-not-allowed':'O login com Google ainda não foi ligado no Firebase (Authentication › Método de login › Google).','auth/unauthorized-domain':'Este endereço não está liberado para login. Adicione-o em Authentication › Configurações › Domínios autorizados.',
    'auth/account-exists-with-different-credential':'Já existe uma conta com este e-mail usando senha. Entre com e-mail e senha.','auth/popup-blocked':'O navegador bloqueou a janela do Google. Tente de novo.','auth/web-storage-unsupported':'Este navegador está bloqueando o login. Desative a navegação privada e tente de novo.'};
  const traduz=e=>ERROS[e&&e.code]||('Não foi possível concluir ('+((e&&e.code)||'erro')+').');
  function setModo(m){modo=m;recuperar=false;
    tela.querySelectorAll('[data-m]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.m===m));
    $('l_nome').hidden=$('l_senha2').hidden=m!=='criar';$('l_senha').hidden=false;$('a_esq').hidden=m!=='entrar';
    $('a_senha').autocomplete=m==='criar'?'new-password':'current-password';$('a_ok').textContent=m==='criar'?'Criar conta':'Entrar';$('a_gtxt').textContent=m==='criar'?'Criar conta com Google':'Entrar com Google';msg('')}
  tela.addEventListener('click',e=>{const b=e.target.closest('[data-m]');if(b)setModo(b.dataset.m)});

  /* ---------- Firebase ---------- */
  let auth=null,fs=null,storage=null;
  let resolverPronto;const pronto=new Promise(r=>resolverPronto=r);
  let usuario=null;

  function iniciar(){
    if(!configurado){msg('Configuração do Firebase pendente. Preencha o arquivo firebase-config.js.','inf');$('a_ok').disabled=true;return}
    // o login com Google passa por CFG.authDomain (vetcamp.web.app), liberado no Google Cloud
    firebase.initializeApp(CFG);
    if(CFG.appCheckKey&&firebase.appCheck&&!DEMO){try{firebase.appCheck().activate(new firebase.appCheck.ReCaptchaV3Provider(CFG.appCheckKey),true)}catch(e){}}
    auth=firebase.auth();fs=firebase.firestore();
    if(DEMO){auth.useEmulator('http://'+location.hostname+':9099',{disableWarnings:true});fs.useEmulator(location.hostname,8080)}
    fs.settings({ignoreUndefinedProperties:true,merge:true});
    if(!DEMO)fs.enablePersistence({synchronizeTabs:true}).catch(()=>{});
    if(CFG.storageBucket&&CFG.storage!==false&&firebase.storage){storage=firebase.storage();if(DEMO)storage.useEmulator(location.hostname,9199)}
    auth.languageCode='pt';
    auth.getRedirectResult().catch(err=>{if(err&&err.code)msg(traduz(err))});
    auth.onAuthStateChanged(u=>{
      if(u){usuario=u;tela.hidden=true;barraVerificacao();resolverPronto(true)}
      else{usuario=null;tela.hidden=false;setTimeout(()=>{try{$('a_email').focus()}catch(e){}},50)}
    });
  }
  const instalado=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
  document.addEventListener('click',async e=>{
    if(!e.target.closest||!e.target.closest('#a_google')||!auth)return;
    const b=$('a_google');b.disabled=true;msg('');
    const prov=new firebase.auth.GoogleAuthProvider();prov.setCustomParameters({prompt:'select_account'});
    try{
      if(instalado())await auth.signInWithRedirect(prov);
      else await auth.signInWithPopup(prov);
    }catch(err){
      if(err&&['auth/popup-blocked','auth/operation-not-supported-in-environment','auth/cancelled-popup-request'].includes(err.code)){try{await auth.signInWithRedirect(prov);return}catch(e2){err=e2}}
      if(!err||!['auth/popup-closed-by-user','auth/cancelled-popup-request','auth/user-cancelled'].includes(err.code))msg(traduz(err));
    }finally{b.disabled=false}
  });
  let falhas=0,bloqueioAte=0;
  document.addEventListener('submit',async e=>{
    if(e.target.id!=='a_form')return;e.preventDefault();if(!auth)return;
    const email=$('a_email').value.trim(),senha=$('a_senha').value;
    const espera=Math.ceil((bloqueioAte-Date.now())/1000);if(espera>0){msg('Muitas tentativas. Aguarde '+espera+' s e tente de novo.');return}
    $('a_ok').disabled=true;msg('');
    try{
      if(recuperar){await auth.sendPasswordResetEmail(email);msg('Enviamos um link para '+email+' criar uma nova senha. Confira também a caixa de spam.','inf');recuperar=false;$('l_senha').hidden=false;$('a_ok').textContent='Entrar'}
      else if(modo==='criar'){
        const nome=$('a_nome').value.trim();
        if(!nome){msg('Digite seu nome.');return}
        if(senha!==$('a_senha2').value){msg('As senhas não são iguais.');return}
        const r=await auth.createUserWithEmailAndPassword(email,senha);
        await r.user.updateProfile({displayName:nome});
        try{await r.user.sendEmailVerification()}catch(_){}
      }else await auth.signInWithEmailAndPassword(email,senha);
    }catch(err){msg(traduz(err));if(err&&/credential|password|user-not-found/.test(err.code||'')){falhas++;if(falhas>=5){bloqueioAte=Date.now()+30000*Math.min(4,falhas-4);msg('Muitas tentativas erradas. Aguarde '+Math.round((bloqueioAte-Date.now())/1000)+' s. Se esqueceu a senha, use "Esqueci minha senha".')}}}
    finally{$('a_ok').disabled=false}
  });
  document.addEventListener('click',e=>{if(e.target&&e.target.id==='a_esq'){recuperar=true;$('l_senha').hidden=true;$('a_ok').textContent='Enviar link para nova senha';msg('Digite seu e-mail e toque no botão. Você vai receber um link para criar uma nova senha.','inf')}});

  function barraVerificacao(){
    const velho=document.getElementById('verifbar');if(velho)velho.remove();
    if(!usuario||usuario.emailVerified||DEMO)return;
    const b=document.createElement('div');b.id='verifbar';b.innerHTML='<span>Confirme seu e-mail: enviamos um link para <b></b>.</span><button type="button" id="vb_re">Reenviar</button><button type="button" id="vb_ok">Já confirmei</button><button type="button" id="vb_x" aria-label="Fechar aviso">×</button>';
    b.querySelector('b').textContent=usuario.email;document.body.prepend(b);
    b.querySelector('#vb_re').onclick=async()=>{try{await usuario.sendEmailVerification();b.querySelector('span').textContent='Link reenviado. Confira também a caixa de spam.'}catch(e){b.querySelector('span').textContent=traduz(e)}};
    b.querySelector('#vb_ok').onclick=async()=>{await usuario.reload();usuario=auth.currentUser;if(usuario.emailVerified)b.remove();else b.querySelector('span').textContent='Ainda não confirmado. Abra o link do e-mail e toque aqui de novo.'};
    b.querySelector('#vb_x').onclick=()=>b.remove();
  }

  /* ---------- interface usada pelo VetCamp ---------- */
  const iniciais=n=>{const s=String(n||'?').trim().split(/\s+/);return((s[0]||'?')[0]+((s[1]||'')[0]||'')).toUpperCase()};
  const avatar=n=>'data:image/svg+xml;base64,'+btoa(unescape(encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64"><rect width="64" height="64" rx="32" fill="#965a27"/><text x="32" y="41" font-family="Arial" font-size="26" font-weight="700" fill="#fff" text-anchor="middle">${iniciais(n)}</text></svg>`)));
  const nomeDe=u=>u.displayName||String(u.email||'').split('@')[0];
  const userNs={
    me:async()=>({id:usuario.uid,name:nomeDe(usuario),email:usuario.email,avatarUrl:usuario.photoURL||avatar(nomeDe(usuario)),color:'#965a27'}),
    id:async()=>usuario.uid,isOwner:async()=>true,canEdit:async()=>true,can:async()=>true,
    profiles:async ids=>Object.fromEntries((ids||[]).map(i=>[i,{id:i,name:i===usuario.uid?nomeDe(usuario):'',isMe:i===usuario.uid}]))};
  const nomeArquivo=n=>String(n||'arquivo').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^\w .()-]/g,'-').replace(/\s+/g,' ').trim()||'arquivo';
  const downloadsNs={save:async({filename,data})=>{filename=nomeArquivo(filename);const blob=data instanceof Blob?data:new Blob([data]);const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=filename;a.rel='noopener';a.style.display='none';document.body.appendChild(a);a.click();setTimeout(()=>{a.remove();URL.revokeObjectURL(url)},60000);return{status:'saved'}}};
  const assetsNs=()=>storage&&{upload:async blob=>{const tipo=blob.type||'application/octet-stream';const ext=(tipo.split('/')[1]||'bin').replace(/[^a-z0-9]/gi,'').slice(0,5);
    const ref=storage.ref(`users/${usuario.uid}/arquivos/${Date.now().toString(36)}-${Math.random().toString(36).slice(2,8)}.${ext}`);
    const s=await ref.put(blob,{contentType:tipo});const url=await s.ref.getDownloadURL();return{id:url,url,sizeBytes:blob.size,contentType:tipo}}};
  function dictationNs(){
    const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return null;
    let rec=null,cbs={state:[],final:[],partial:[]};const emit=(k,v)=>cbs[k].forEach(f=>{try{f(v)}catch(e){}});
    return{onState:f=>cbs.state.push(f),onFinal:f=>cbs.final.push(f),onPartial:f=>cbs.partial.push(f),
      start:()=>new Promise((ok,erro)=>{try{rec=new SR();rec.lang='pt-BR';rec.continuous=true;rec.interimResults=true;
        rec.onstart=()=>{emit('state',{state:'listening'});ok()};
        rec.onresult=ev=>{for(let i=ev.resultIndex;i<ev.results.length;i++){const t=ev.results[i][0].transcript;emit(ev.results[i].isFinal?'final':'partial',{text:t.trim()})}};
        rec.onerror=ev=>{if(ev.error==='not-allowed'){erro({code:'not_granted'})}};
        rec.onend=()=>emit('state',{state:'idle',reason:'stopped'});rec.start()}catch(e){erro({code:'unavailable'})}}),
      stop:async()=>{try{rec&&rec.stop()}catch(e){}}};
  }
  window.claude={use:async nome=>{
    if(!configurado)return null;await pronto;
    if(nome==='db')return fs;if(nome==='user')return userNs;if(nome==='downloads')return downloadsNs;
    if(nome==='assets')return assetsNs()||null;if(nome==='dictation')return dictationNs();return null}};

  window.SAMVET_AUTH={
    email:()=>usuario&&usuario.email,verificado:()=>!!(usuario&&(usuario.emailVerified||DEMO)),
    async sair(){
      if(!navigator.onLine&&!confirm2())return;
      try{await Promise.race([fs.waitForPendingWrites(),new Promise(r=>setTimeout(r,4000))])}catch(e){}

function enviar(col,id,body,del){

  const jaNaFila=k in ultimo;ultimo[k]=op;emVoo.add(k);

function gravar(col,obj,arr){
  obj.atualizado=Date.now();
  const i=arr.findIndex(x=>x.id===obj.id);i<0?arr.push(obj):arr[i]=obj;
  if(!db){LS.set(lsKey(col),arr);render();return Promise.resolve()}
  LS.set(PFX+'cache-'+col,arr);render();
  const body=JSON.parse(JSON.stringify(obj));delete body.id;
  return enviar(col,obj.id,body);
}
function apagar(col,id){
  const a=COLS[col];S[a]=S[a].filter(x=>x.id!==id);if(col==='pacientes')S.sel=null;if(col==='clientes')S.cliSel=null;
  if(!db){LS.set(lsKey(col),S[a]);render();return}
  enviar(col,id,null,true);render();
}

  const calc=()=>{
    const pe=num($('c_peso').value),mg=pe*num($('c_dose').value),c=num($('c_conc').value);

    const fp=num($('fl_peso').value),def=fp*num($('fl_desid').value)*10/1000,man=fp*num($('fl_man').value)/1000,pd=num($('fl_perda').value),h=num($('fl_h').value)||24,gt=num($('fl_gt').value);

  };

  document.querySelectorAll('.calc input,.calc select').forEach(i=>i.addEventListener('input',calc));calc();
}

   <fieldset class="pgrp"><legend>Deslocamento</legend><div class="prow"><label for="pr_km">Valor do km rodado</label><span class="rs">R$</span><input id="pr_km" data-km="1" type="number" step="any" min="0" inputmode="decimal" value="${esc(c.kmval||'')}"></div></fieldset>
  </div>`;
  const v=$('view');

  v.querySelectorAll('[data-sv]').forEach(el=>el.addEventListener('change',()=>salvarCfg({...S.cfg,servicos:(S.cfg.servicos||[]).map(x=>x.id===el.dataset.sv?{...x,valor:el.value.trim()}:x)},'Preço salvo',1)));

function desenhaBarras(s,serie,sel){
  const draw=()=>{const W=s.clientWidth,H=s.clientHeight;if(!W)return;const pl=8,pr=8,pt=24,pb=26,mx=Math.max(...serie.map(x=>x.v),1);
    const ticks=[0,mx/2,mx],bw=(W-pl-pr)/serie.length,Y=v=>H-pb-(v/mx)*(H-pt-pb);
    let g=ticks.map(t=>`<line x1="${pl}" x2="${W-pr}" y1="${Y(t)}" y2="${Y(t)}" stroke="var(--line)" stroke-width="1"/>`).join('');
    g+=serie.map((x,i)=>{const x0=pl+i*bw+bw*0.18,w=Math.max(4,bw*0.64),y=Y(x.v),h=H-pb-y,r=Math.min(4,w/2,h);const on=x.m===sel;
      const path=h>0?`M${x0},${H-pb} V${y+r} Q${x0},${y} ${x0+r},${y} H${x0+w-r} Q${x0+w},${y} ${x0+w},${y+r} V${H-pb} Z`:'';
      return `<g class="hb"><rect x="${pl+i*bw}" y="${pt-20}" width="${bw}" height="${H-pt+20}" fill="transparent"><title>${nomeMesC(x.m)} ${x.m.slice(0,4)}: ${R$(x.v)}</title></rect>${path?`<path d="${path}" fill="${on?'var(--act)':'var(--brand)'}" opacity="${on?1:.75}" pointer-events="none"/>`:''}
      <text x="${x0+w/2}" y="${H-8}" text-anchor="middle" font-size="12" fill="${on?'var(--ink)':'var(--mute)'}" font-weight="${on?700:400}">${nomeMesC(x.m)}</text>${on&&x.v?`<text x="${x0+w/2}" y="${y-6}" text-anchor="middle" font-size="12" font-weight="700" fill="var(--ink)">${R$(x.v).replace(',00','')}</text>`:''}</g>`}).join('');
    s.innerHTML=g};
  new ResizeObserver(draw).observe(s);
}
function csvLanc(){
  const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
  const rows=[['Data','Paciente','Cliente','Seção','Descrição','Total','Recebido','Em aberto','Situação','Forma']];
  for(const {f,p} of lancamentos())rows.push([f.data,p.nome,nomeCli(p),secaoFin(f),f.desc,num(f.total).toFixed(2).replace('.',','),num(f.pago).toFixed(2).replace('.',','),saldo(f).toFixed(2).replace('.',','),f.sit,f.forma]);
  return '﻿'+rows.map(r=>r.map(q).join(';')).join('\r\n');
}

function valorProt(it){if(num(it.valor))return num(it.valor);if(it.t==='Medicação')return preco('meds','Aplicação (por dose)');if(it.t==='Vacina'||it.t==='Vermífugo')return preco('vacinas',it.t);if(it.t==='Exame')return preco('exames',it.nome);const s=(S.cfg.servicos||[]).find(x=>x.nome===it.nome);return s?num(s.valor):0}
function confirmarProtocolo(p,pr){
  $('card').innerHTML=`<h2>${esc(pr.nome)}</h2><p class="hint">Marque o que vai aplicar em ${esc(p.nome)}. Doses são modelos: confira antes de aplicar.</p>
  <div class="ck" style="flex-direction:column;align-items:stretch">${pr.itens.map((it,i)=>`<label><input type="checkbox" value="${i}" checked><span><b>${esc(it.t)}:</b> ${esc(it.nome)} ${esc([it.dose,it.via,it.freq?'a cada '+it.freq+' h':'',it.dias?it.dias+' dia(s)':''].filter(Boolean).join(' · '))} <span class="meta">${valorProt(it)?R$(valorProt(it))+(it.t==='Medicação'?' por dose':''):'sem valor'}</span></span></label>`).join('')}</div>
  <div class="acts"><button class="btn" id="cancel">Cancelar</button><button class="btn pri" id="papl">Aplicar na ficha</button></div>`;

    const sel=[...$('card').querySelectorAll('input:checked')].map(x=>pr.itens[+x.value]);const q={...p},h=hoje(),por=meId();let est=0;
    for(const it of sel){const v=valorProt(it);
      if(it.t==='Medicação')q.meds=[...(q.meds||[]),{id:uid(),med:it.nome,dose:it.dose||'',via:it.via||'IV',freq:it.freq||'24',inicio:h,fim:it.dias?addD(h,+it.dias-1):'',valorAplic:v?String(v):'',estId:(estPorNome(it.nome)||{}).id||'',consumo:estPorNome(it.nome)?'1':'',obs:'Protocolo: '+pr.nome,por}];
      else if(it.t==='Vacina'||it.t==='Vermífugo'){q.vacinas=[...(q.vacinas||[]),{id:uid(),tipo:it.t,nome:it.nome,data:h,valor:v?String(v):'',consumo:'1',obs:'Protocolo: '+pr.nome+(it.dose?' · '+it.dose:''),por}];if(moverEstoque(it.nome,1,'Protocolo · '+p.nome))est++}
      else if(it.t==='Exame')q.exames=[...(q.exames||[]),{id:uid(),nome:it.nome,data:h,valor:v?String(v):'',por}];
      else q.fin=[...(q.fin||[]),{id:uid(),data:h,tipo:'Serviço',desc:it.nome,qtd:'1',unit:String(v),total:String(v),sit:'Pendente',pago:'',por}];
    }
    salvar(q);fechar();toast(`${sel.length} item(ns) aplicado(s)${est?' · '+est+' baixa(s) no estoque':''}`);
  };
}

/* ---------- assinatura ---------- */
function padAssin(el){
  el.innerHTML=`<canvas width="600" height="180" class="pad" aria-label="Área para assinar com o dedo ou o mouse"></canvas><div class="btns"><button type="button" class="btn sm ghost">Limpar</button></div>`;
  const cv=el.querySelector('canvas'),cx=cv.getContext('2d');let des=false,tem=false,last=null;
  cx.lineWidth=2.6;cx.lineCap='round';cx.lineJoin='round';cx.strokeStyle='#1a1410';
  const pt=e=>{const r=cv.getBoundingClientRect();return[(e.clientX-r.left)*cv.width/r.width,(e.clientY-r.top)*cv.height/r.height]};
  cv.addEventListener('pointerdown',e=>{des=true;last=pt(e);cv.setPointerCapture(e.pointerId);e.preventDefault()});
  cv.addEventListener('pointermove',e=>{if(!des)return;const p=pt(e);cx.beginPath();cx.moveTo(...last);cx.lineTo(...p);cx.stroke();last=p;tem=true});
  ['pointerup','pointercancel'].forEach(t=>cv.addEventListener(t,()=>des=false));
  el.querySelector('button').onclick=()=>{cx.clearRect(0,0,cv.width,cv.height);tem=false};
  return{vazio:()=>!tem,blob:()=>new Promise(r=>cv.toBlob(r,'image/png')),url:()=>cv.toDataURL('image/png')};
}
async function guardarAssin(pad){
  if(pad.vazio())return null;
  if(assets){try{const r=await assets.upload(await pad.blob());return{assetId:r.id}}catch(e){}}
  return{url:pad.url()};
}
const srcAssin=a=>a?(a.assetId?blobSrc(a.assetId):a.url||''):'';
async function dataUrlDe(src){if(!src||src.startsWith('data:'))return src;try{const b=await (await fetch(src)).blob();return await new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(b)})}catch(e){return''}}
async function htmlDoc(titulo,texto,assT,nomeT){
  const v=await dataUrlDe(srcAssin(S.cfg.assinVet)),t=await dataUrlDe(srcAssin(assT));
  const e=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
  return `<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>${e(titulo)}</title><style>body{font:15px/1.55 Georgia,serif;max-width:720px;margin:40px auto;padding:0 24px;color:#222}pre{white-space:pre-wrap;font:inherit}.as{display:flex;gap:40px;flex-wrap:wrap;margin-top:30px}.as div{text-align:center}.as img{height:80px;display:block;margin:0 auto}.as span{display:block;border-top:1px solid #444;padding-top:4px;min-width:220px}</style></head><body><pre>${e(texto)}</pre>${v||t?`<div class="as">${t?`<div><img src="${t}" alt=""><span>${e(nomeT||'Tutor / responsável')}</span></div>`:''}${v?`<div><img src="${v}" alt=""><span>${e(S.cfg.vet||'Médico(a)-veterinário(a)')}${S.cfg.crmv?' · CRMV '+e(S.cfg.crmv):''}</span></div>`:''}</div>`:''}</body></html>`;
}

const orcStatus=o=>(o.status==='Enviado'||o.status==='Rascunho')&&dias(orcValidade(o))<0?'Vencido':o.status||'Rascunho';
const ORC_COR={Rascunho:'obito',Enviado:'acompanhamento',Aprovado:'alta',Recusado:'internado',Vencido:'tratamento'};
function orcTotais(o){
  const its=(o.itens||[]).filter(i=>i.desc);const sub=its.reduce((s,i)=>s+num(i.qtd||1)*num(i.unit),0);
  const desc=o.descTipo==='%'?sub*num(o.descValor)/100:num(o.descValor);
  const km=num(o.km)*num(o.kmval!==undefined&&o.kmval!==''?o.kmval:S.cfg.kmval);
  return{its,sub,desc:Math.min(desc,sub),km,total:Math.max(0,sub-Math.min(desc,sub)+km)};
}
function proxNumOrc(){const ano=hoje().slice(0,4);const n=S.orc.map(o=>String(o.numero||'')).filter(x=>x.startsWith('ORC-'+ano)).map(x=>+x.split('-')[2]||0);return `ORC-${ano}-${String((n.length?Math.max(...n):0)+1).padStart(4,'0')}`}
function catalogo(){
  const out=[];
  for(const {m,nomes} of PRECOS())for(const n of nomes){const v=preco(m.key,n);if(v)out.push({g:m.tab,nome:m.key==='meds'?'Aplicação de medicação':n,valor:v})}
  for(const x of (S.cfg.servicos||[]))out.push({g:'Serviços e produtos',nome:x.nome,valor:num(x.valor)});
  for(const x of S.est)if(num(x.preco))out.push({g:'Estoque',nome:x.nome+(x.un?' ('+x.un+')':''),valor:num(x.preco)});
  return out;
}

function nomesAnimais(txt){return String(txt||'').replace(/\([^)]*\)/g,'').split(/\s*[,;/]\s*|\s+e\s+/).map(x=>x.trim()).filter(Boolean)}
function aprovarOrc(o){

   ${animais.map((a,i)=>a.p?`<p class="ok" style="margin:0">Animal já cadastrado: ${esc(a.p.nome)}</p>`:`<label><input type="checkbox" data-apnovo="${i}" checked><span>Cadastrar o animal <b>${esc(a.novo)}</b>${espTxt&&animais.length===1?' ('+esc([espTxt,raca].filter(Boolean).join(', '))+')':''}</span></label>`).join('')}
   ${animais.length?'':`<p class="meta" style="margin:0">Nenhum animal informado no orçamento.</p>`}
  </div>
  <div class="fld" style="margin-top:10px"><label for="ap_lanc">Lançar ${R$(t.total)} no Financeiro de</label><select id="ap_lanc">${animais.map((a,i)=>`<option value="${i}">${esc(a.p?a.p.nome:a.novo)}</option>`).join('')}${S.pac.filter(doCli).filter(p=>!animais.some(a=>a.p&&a.p.id===p.id)).map(p=>`<option value="p:${esc(p.id)}">${esc(p.nome)}</option>`).join('')}<option value="">Não lançar valores</option></select></div>

  <div class="acts"><button class="btn ghost" id="cancel">Voltar</button><button class="btn pri" id="ap_ok">Aprovar e cadastrar</button></div>`;
  $('sheet').classList.add('on');$('card').scrollTop=0;
  $('cancel').onclick=fechar;

    $('ap_ok').disabled=true;

    const esp=ESP.includes(espTxt)?espTxt:'Equino';
    const lista=animais.map((a,i)=>{if(a.p)return a.p;const ck=$('card').querySelector(`[data-apnovo="${i}"]`);if(!ck||!ck.checked)return null;
      return{id:uid(),nome:a.novo,especie:esp,raca:animais.length===1?raca:'',sexo:'Macho',castrado:'Não',status:'tratamento',tutor:c?c.nome:o.cliente,tel:o.tel||'',cpf:o.doc||'',clienteId:c?c.id:'',criado:Date.now(),origem:o.numero,por:meId(),_novo:1}});

  };
}
function lancarOrc(q,o,t){
  const novos=t.its.map(i=>({id:uid(),data:hoje(),tipo:'Serviço',desc:i.desc+' ('+o.numero+')',qtd:String(num(i.qtd||1)),unit:String(num(i.unit)),total:String(num(i.qtd||1)*num(i.unit)),sit:'Pendente',pago:'',orc:o.id,por:meId()}));
  let resto=t.desc;for(const e of [...novos].sort((a,b)=>num(b.total)-num(a.total))){if(resto<=0)break;const ab=Math.min(resto,num(e.total));e.desconto=String(ab);e.total=String(num(e.total)-ab);resto-=ab}
  if(t.km)novos.push({id:uid(),data:hoje(),tipo:'Deslocamento (km)',desc:'Deslocamento ('+o.km+' km) · '+o.numero,qtd:String(num(o.km)),unit:String(num(o.kmval||S.cfg.kmval)),total:String(t.km),sit:'Pendente',pago:'',orc:o.id});
  return{...q,fin:[...(q.fin||[]).filter(f=>f.orc!==o.id),...novos]};
}

function csvOrc(){
  const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"',m=v=>num(v).toFixed(2).replace('.',',');
  const rows=[['Número','Data','Validade','Situação','Cliente','CPF/CNPJ','Telefone','Animal','Itens','Subtotal','Desconto','Deslocamento','Total']];
  for(const o of [...S.orc].sort((a,b)=>String(a.numero).localeCompare(String(b.numero)))){const t=orcTotais(o);rows.push([o.numero,br(o.data),br(orcValidade(o)),orcStatus(o),o.cliente,o.doc,o.tel,o.animal,t.its.map(i=>`${i.desc} (${fx(num(i.qtd||1),2)} x ${m(i.unit)})`).join(' | '),m(t.sub),m(t.desc),m(t.km),m(t.total)])}

}

/* Pix (BR Code) */
function crc16(s){let c=0xFFFF;for(const ch of new TextEncoder().encode(s)){c^=ch<<8;for(let i=0;i<8;i++)c=(c&0x8000)?((c<<1)^0x1021)&0xFFFF:(c<<1)&0xFFFF}return c.toString(16).toUpperCase().padStart(4,'0')}
function chavePix(){const c=S.cfg,k=String(c.pix||'').trim(),tipo=c.pixTipo||'';if(!k)return'';
  if(tipo==='E-mail'||k.includes('@'))return k.toLowerCase();
  if(tipo==='Aleatória'||/^[0-9a-f]{8}-[0-9a-f]{4}-/i.test(k))return k.toLowerCase();
  const dg=k.replace(/\D/g,'');
  if(tipo==='Celular'||k.startsWith('+'))return '+'+(dg.length>=12&&dg.startsWith('55')?dg:'55'+dg);
  return dg||k;}
function pixPayload(valor,txid){
  const f=(id,v)=>id+String(v.length).padStart(2,'0')+v;
  const limpa=(s,n)=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^A-Za-z0-9 ]/g,'').toUpperCase().replace(/\s+/g,' ').trim().slice(0,n)||'VETCAMP';
  const c=S.cfg,cidade=String(c.pixCidade||c.cidade||'').split('/')[0];
  let p=f('00','01')+f('26',f('00','br.gov.bcb.pix')+f('01',chavePix()))+f('52','0000')+f('53','986')+(valor>0?f('54',(+valor).toFixed(2)):'')+f('58','BR')+f('59',limpa(c.pixNome||c.vet||c.clinica,25))+f('60',limpa(cidade,15))+f('62',f('05',String(txid||'***').replace(/[^A-Za-z0-9]/g,'').slice(0,25)||'***'));
  p+='6304';return p+crc16(p);
}

  const its=S.pac.flatMap(p=>(p.agend||[]).filter(a=>a.data===hoje()&&['Agendado','Confirmado'].includes(a.situacao)).map(a=>({a,p}))).sort((x,y)=>String(x.a.hora||'').localeCompare(String(y.a.hora||'')));
  const ends=[];for(const {a,p} of its){const c=cliDe(p);const e=a.local||[p.end,p.prop].filter(Boolean).join(', ')||(c?[c.end,c.cidade].filter(Boolean).join(', '):'');if(e&&!ends.includes(e))ends.push(e)}
  return ends;
}
function rotaUrl(ends){if(!ends.length)return '';const dest=ends[ends.length-1],way=ends.slice(0,-1).slice(0,9);return 'https://www.google.com/maps/dir/?api=1&travelmode=driving&destination='+encodeURIComponent(dest)+(way.length?'&waypoints='+encodeURIComponent(way.join('|')):'')}

/* desfazer */
let desfazerTimer=null;
function desfazivel(msg,restaurar){
  let el=$('desfazer');if(!el){el=document.createElement('div');el.id='desfazer';el.className='desfazer';el.setAttribute('role','status');document.body.appendChild(el)}
  el.innerHTML=`<span></span><button type="button" class="btn sm">Desfazer</button>`;el.querySelector('span').textContent=msg;el.hidden=false;
  el.querySelector('button').onclick=()=>{clearTimeout(desfazerTimer);el.hidden=true;restaurar();toast('Desfeito')};
  clearTimeout(desfazerTimer);desfazerTimer=setTimeout(()=>{el.hidden=true},7000);
}
/* busca em tudo */
const semAcento=x=>String(x||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
function buscarTudo(q){
  const t=semAcento(q).trim();if(t.length<2)return[];
  const r=[],tem=(...v)=>semAcento(v.join(' ')).includes(t);
  for(const p of S.pac){if(tem(p.nome,p.tutor,p.raca,p.chip,p.registro,p.prop,p.pelagem))r.push({tipo:'Animal',tit:p.nome,sub:[p.especie,p.raca,p.tutor].filter(Boolean).join(' · '),abrir:{id:p.id}});
    for(const m of MODS)for(const it of (p[m.key]||[]))if(tem(...Object.values(it).filter(v=>typeof v==='string'&&v.length<400)))r.push({tipo:m.tab,tit:`${p.nome} · ${tituloIt(m,it)}`,sub:br(it[m.dateK||'data']),abrir:{id:p.id,tab:m.key}})}
  for(const c of S.cli)if(tem(c.nome,c.doc,c.tel,c.cidade,c.contato))r.push({tipo:'Cliente',tit:c.nome,sub:[c.tipo,c.cidade,c.tel].filter(Boolean).join(' · '),abrir:{cli:c.id}});
  for(const o of S.orc)if(tem(o.numero,o.cliente,o.animal))r.push({tipo:'Orçamento',tit:`${o.numero} · ${o.cliente}`,sub:br(o.data)+' · '+R$(orcTotais(o).total),abrir:{orc:o.id}});
  for(const x of S.est)if(tem(x.nome,x.lote,x.forn))r.push({tipo:'Estoque',tit:x.nome,sub:fx(num(x.qtd),2)+' '+(x.un||''),abrir:{vis:'estoque'}});
  return r.slice(0,60);
}
function abrirBusca(){
  $('card').innerHTML=`<h2>Buscar no VetCamp</h2><input class="search" id="bq" type="search" placeholder="Animal, tutor, cliente, diagnóstico, orçamento, produto…" aria-label="Buscar em tudo" autocomplete="off"><div id="bres"><p class="meta">Digite pelo menos 2 letras. Dica: no computador, aperte <b>/</b> para abrir a busca.</p></div><div class="acts"><button class="btn" id="cancel">Fechar</button></div>`;
  $('sheet').classList.add('on');$('cancel').onclick=fechar;
  const mostrar=()=>{const l=buscarTudo($('bq').value);$('bres').innerHTML=$('bq').value.trim().length<2?'<p class="meta">Digite pelo menos 2 letras.</p>':l.length?l.map((x,i)=>`<button class="row" data-bres="${i}"><span class="av">${esc(x.tipo.slice(0,2))}</span><span><h3>${esc(x.tit)}</h3><span class="meta">${esc(x.tipo)} · ${esc(x.sub||'')}</span></span></button>`).join(''):'<p class="meta">Nada encontrado.</p>';
    $('bres').querySelectorAll('[data-bres]').forEach(b=>b.onclick=()=>{const a=l[+b.dataset.bres].abrir;$('sheet').classList.remove('on');
      if(a.id){S.sel=a.id;S.tab=a.tab||'resumo';render();scrollTo(0,0)}else if(a.cli){S.sel=null;S.vis='clientes';S.cliSel=a.cli;render()}else if(a.orc){S.sel=null;S.vis='orc';render();const o=S.orc.find(x=>x.id===a.orc);if(o)verOrc(o)}else if(a.vis){S.sel=null;S.vis=a.vis;render()}})};
  $('bq').oninput=mostrar;setTimeout(()=>$('bq').focus(),30);
}
/* linha do tempo do animal */
function resumoTutor(p,it){const c=S.cfg;return `Olá, ${p.tutor||''}! Aqui é da ${c.clinica||'VetCamp'}. Resumo do atendimento de ${p.nome} em ${br(it.data)}:${it.diag?'\n\nDiagnóstico: '+it.diag:''}${it.trat?'\n\nTratamento: '+it.trat:''}${it.orient?'\n\nOrientações: '+it.orient:''}${it.retorno?'\n\nRetorno: '+br(it.retorno):''}\n\nQualquer dúvida, é só chamar.${c.vet?'\n'+c.vet+(c.crmv?' · CRMV '+c.crmv:''):''}`}
function linhaTempo(p){
  const ev=[];
  for(const m of MODS)if(modVis(m,p))for(const it of (p[m.key]||[])){const d=it[m.dateK||'data'];if(!d)continue;
    const extra=m.key==='consultas'?[it.diag,it.queixa].filter(Boolean).join(' · '):m.key==='meds'?[it.dose,it.via,(it.aplic||[]).length?(it.aplic.length+' aplicação(ões)'):''].filter(Boolean).join(' · '):m.key==='fin'?R$(it.total)+(saldo(it)?' · em aberto':' · pago'):(it.obs||it.res||it.diag||it.resultado||'');
    ev.push({d,h:it.hora||'',tipo:m.tab,tab:m.key,tit:tituloIt(m,it),extra})}
  for(const d of (p.docs||[]))ev.push({d:d.data,h:'',tipo:'Documento',tab:'docs',tit:d.titulo,extra:d.assinT?'assinado':''});
  for(const a of (p.anexos||[]))ev.push({d:a.data,h:'',tipo:'Anexo',tab:'anexos',tit:a.desc||a.nome,extra:a.regiao||''});
  ev.sort((a,b)=>(b.d+b.h).localeCompare(a.d+a.h));
  let mes='',html='';
  for(const e of ev){const m=String(e.d).slice(0,7);if(m!==mes){mes=m;html+=`<h3 class="dayh">${new Date(m+'-15T12:00:00').toLocaleDateString('pt-BR',{month:'long',year:'numeric'})}</h3>`}
    html+=`<button class="tl" data-tab="${esc(e.tab)}"><span class="tld">${br(e.d).slice(0,5)}${e.h?'<br>'+esc(e.h):''}</span><span><b>${esc(e.tipo)}:</b> ${esc(e.tit)}${e.extra?`<br><span class="meta">${esc(String(e.extra).slice(0,140))}</span>`:''}</span></button>`}
  return `<div class="bar"><h3>Linha do tempo</h3><span class="meta">${ev.length} registro(s)</span></div><p class="hint">Tudo o que aconteceu com ${esc(p.nome)}, do mais recente para o mais antigo. Toque para abrir.</p>${ev.length?`<div class="tlw">${html}</div>`:'<div class="empty"><p>Nenhum registro ainda.</p></div>'}`;
}
/* agenda para o calendário do celular (.ics) */
function icsAgenda(){
  const its=S.pac.filter(p=>p.status!=='obito').flatMap(pendencias).filter(x=>dias(x.d)>=-1&&dias(x.d)<=90&&x.tab!=='fin');
  const e=s=>String(s||'').replace(/[\\;,]/g,m=>'\\'+m).replace(/\n/g,'\\n');
  const dt=(d,h)=>d.replace(/-/g,'')+(h?'T'+h.replace(':','')+'00':'');
  const fim=(d,h)=>{if(h){const[hh,mm]=h.split(':').map(Number);const t=new Date(2000,0,1,hh,mm+60);return d.replace(/-/g,'')+'T'+String(t.getHours()).padStart(2,'0')+String(t.getMinutes()).padStart(2,'0')+'00'}return addD(d,1).replace(/-/g,'')};
  const ev=its.map((x,i)=>['BEGIN:VEVENT',`UID:vetcamp-${x.p.id}-${i}-${x.d}@vetcamp.web.app`,`DTSTAMP:${new Date().toISOString().replace(/[-:]/g,'').slice(0,15)}Z`,x.h?`DTSTART:${dt(x.d,x.h)}`:`DTSTART;VALUE=DATE:${dt(x.d)}`,x.h?`DTEND:${fim(x.d,x.h)}`:`DTEND;VALUE=DATE:${fim(x.d)}`,`SUMMARY:${e(x.p.nome+' · '+x.txt)}`,`DESCRIPTION:${e([x.p.tutor,x.p.prop,x.p.tel].filter(Boolean).join(' · '))}`,'END:VEVENT'].join('\r\n'));
  return {n:its.length,txt:['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//VetCamp//Agenda//PT-BR','CALSCALE:GREGORIAN','X-WR-CALNAME:VetCamp',...ev,'END:VCALENDAR'].join('\r\n')};
}

function semCobranca(dd=60){
  const out=[];for(const p of S.pac)for(const m of MODS){if(SEMVALOR.includes(m.key)||m.key==='evolucao')continue;for(const it of (p[m.key]||[])){const d=it[m.dateK||'data'];if(!d||dias(d)<-dd||dias(d)>0)continue;if(!valorItem(m,it)&&!it.semCobranca)out.push({p,m,it,d})}}
  return out.sort((a,b)=>b.d.localeCompare(a.d));
}

function modulo(m,p){
  const fs=campos(m.f,p).filter(f=>f.k),dk=m.dateK||'data';
  const l=ord(p[m.key],dk);
  let topo='';
  if(m.key!=='fin'&&!SEMVALOR.includes(m.key)){const ids=new Set(l.map(x=>x.id)),fl=(p.fin||[]).filter(f=>f.ref&&(ids.has(f.ref)||ids.has(String(f.ref).replace(/-km$/,''))));if(fl.length)topo=`<p class="info">Subtotal de ${esc(m.tab)}: <b>${R$(fl.reduce((s,f)=>s+num(f.total),0))}</b>${fl.some(f=>saldo(f))?` · em aberto <b class="late">${R$(fl.reduce((s,f)=>s+saldo(f),0))}</b>`:''}</p>`}

    return `<div class="mapa" id="${id}"><div class="mgrp"><b>Corpo</b><div class="ck">${REG_CORPO.map(ch).join('')}</div></div><div class="mlimbs">${MEMB.map(mb=>`<div class="mgrp"><b>${MEMB_NOME[mb]}</b><div class="ck">${REG_MEMBRO.map(r=>ch(mb+' · '+r)).join('')}</div></div>`).join('')}</div></div>`}
  if(f.t==='triadan'){const arr=Array.isArray(v)?v:String(v||'').split(/[\s,;]+/).filter(Boolean);const q=(c,rev)=>{const l=[];for(let i=1;i<=11;i++)l.push(String(c*100+i));if(rev)l.reverse();return l.map(t=>`<button type="button" class="dente" data-dente="${t}" aria-pressed="${arr.includes(t)}">${t}</button>`).join('')};
    return `<div class="triadan" id="${id}"><div class="arc"><span class="qlab">Superior direito</span><span class="qlab">Superior esquerdo</span><div class="q">${q(1,1)}</div><div class="q">${q(2)}</div><div class="q">${q(4,1)}</div><div class="q">${q(3)}</div><span class="qlab">Inferior direito</span><span class="qlab">Inferior esquerdo</span></div><p class="meta" style="margin:4px 0 0">Toque nos dentes tratados. 01–03 incisivos, 04 canino, 05 dente de lobo, 06–11 pré-molares e molares.</p></div>`}
  return '';
}

function desenhaPeso(s,p){
  const pts=ult(p).filter(c=>c.peso).reverse().map(c=>({d:c.data,v:+c.peso}));
  const draw=()=>{const W=s.clientWidth,H=s.clientHeight,pad=28;if(!W)return;const vs=pts.map(x=>x.v),mn=Math.min(...vs),mx=Math.max(...vs),r=mx-mn||1;
    const X=i=>pad+i*(W-pad*2)/(pts.length-1),Y=v=>H-pad-(v-mn)/r*(H-pad*2);
    s.innerHTML=`<polyline fill="none" stroke="var(--brand)" stroke-width="3" points="${pts.map((x,i)=>X(i)+','+Y(x.v)).join(' ')}"/>`+pts.map((x,i)=>`<circle cx="${X(i)}" cy="${Y(x.v)}" r="5" fill="var(--act)"/>${W>520||i===0||i===pts.length-1?`<text x="${X(i)}" y="${Y(x.v)-10}" text-anchor="middle" font-size="13" fill="var(--ink)">${esc(x.v)}</text><text x="${X(i)}" y="${H-6}" text-anchor="middle" font-size="12" fill="var(--mute)">${esc(br(x.d).slice(0,5))}</text>`:''}`).join('')};
  const ro=new ResizeObserver(draw);ro.observe(s);
}

function textoFicha(p){

  for(const f of campos(F_PAC,p))if(f.k&&!vazio(p[f.k]))L.push(`${f.l}: ${f.k==='status'?stLabel(p.status):fmt(f,p[f.k])}`);
  for(const m of MODS.filter(m=>modVis(m,p))){const l=ord(p[m.key],m.dateK||'data');if(!l.length)continue;L.push('',m.titulo.toUpperCase());
    for(const it of l){L.push('— '+br(it[m.dateK||'data'])+' · '+(it[m.titleK]||''));for(const f of campos(m.f,p))if(f.k&&f.k!==(m.dateK||'data')&&f.k!==m.titleK&&!vazio(it[f.k]))L.push(`${f.l}: ${fmt(f,it[f.k])}`);if(it.aplic&&it.aplic.length)L.push('Aplicações: '+it.aplic.map(hora).join(', '))}}

function renderWho(){

aplicarAparencia();
render();
(async()=>{
  const use=n=>window.claude&&window.claude.use?window.claude.use(n).catch(()=>null):Promise.resolve(null);

  if(user){try{me=await user.me()}catch(e){me=null}try{isDono=!!(await user.isOwner())}catch(e){isDono=false}}
  const uid=me&&me.id;
  if(db&&!uid){db=null;window.__semId=1}
  if(db){BASE=`data/users/${uid}/samvet`;PFX='samvet-'+uid.replace(/[^A-Za-z0-9]/g,'').slice(-10)+'-';
    const velho=LS.get('samvet-pendentes',null);if(velho&&velho.length){LS.set(PFX+'pendentes',[...LS.get(PFX+'pendentes',[]),...velho]);try{localStorage.removeItem('samvet-pendentes')}catch(e){}}}
  renderWho();
  if(dict){
    dict.onState(({state})=>{if(micBtn){micBtn.classList.toggle('on',state==='listening');micBtn.textContent=state==='listening'?'Parar':'Ditar';if(state==='idle')micBtn=null}});
    dict.onFinal(({text})=>{if(micTa&&text)micTa.value=(micTa.value?micTa.value.replace(/\s*$/,' '):'')+text});
  }
  if(!db){
    S.pac=LS.get('prontuario-vet',[]);S.est=LS.get('samvet-estoque',[]);S.cli=LS.get('samvet-clientes',[]);S.orc=LS.get('samvet-orcamentos',[]);S.desp=LS.get('samvet-despesas',[]);S.cfg=LS.get('samvet-config',{});
    note(window.__semId?'Não foi possível identificar sua conta neste link, então os dados ficam só neste aparelho. Peça a quem compartilhou para te convidar com acesso de edição.':'Modo local: os dados ficam só neste navegador. Entre na sua conta Claude para acessar de qualquer aparelho.','<button class="btn sm" data-vis="conta">Como entrar</button>');render();return}
  S.pac=LS.get(PFX+'cache-pacientes',[]);S.est=LS.get(PFX+'cache-estoque',[]);S.cli=LS.get(PFX+'cache-clientes',[]);S.orc=LS.get(PFX+'cache-orcamentos',[]);S.desp=LS.get(PFX+'cache-despesas',[]);S.cfg=LS.get(PFX+'cache-config',{});render();
  note(S.pac.length?'Mostrando os dados salvos neste aparelho enquanto conecta…':'Carregando pacientes…');
  timer=setTimeout(()=>note('Não foi possível carregar os dados ainda. Verifique a conexão.'),10000);
  const idle=()=>!$('sheet').classList.contains('on');
  colRef('pacientes').onSnapshot(snap=>{
    if(!snap.metadata.fromCache){clearTimeout(timer);note('')}
    S.pac=mesclarSnap('pacientes',snap.docs.map(d=>({...d.data(),id:d.id})),S.pac);LS.set(PFX+'cache-pacientes',S.pac);avisoPend();
    if(S.sel&&!cur())S.sel=null;
    if(idle()&&!(document.activeElement&&document.activeElement.closest&&document.activeElement.closest('#view .calc,#view #cfgf,#view .box input')))renderLogo();
  },e=>{clearTimeout(timer);note('Erro ao carregar os dados ('+e.code+').')});
  colRef('despesas').onSnapshot(snap=>{S.desp=mesclarSnap('despesas',snap.docs.map(d=>({...d.data(),id:d.id})),S.desp);LS.set(PFX+'cache-despesas',S.desp);if(idle()&&['caixa','relat'].includes(S.vis)&&!S.sel)renderLogo()},()=>{});
  colRef('orcamentos').onSnapshot(snap=>{S.orc=mesclarSnap('orcamentos',snap.docs.map(d=>({...d.data(),id:d.id})),S.orc);LS.set(PFX+'cache-orcamentos',S.orc);if(idle()&&S.vis==='orc'&&!S.sel&&!(document.activeElement&&document.activeElement.id==='qo'))renderLogo()},()=>{});
  colRef('clientes').onSnapshot(snap=>{S.cli=mesclarSnap('clientes',snap.docs.map(d=>({...d.data(),id:d.id})),S.cli);LS.set(PFX+'cache-clientes',S.cli);if(idle()&&S.vis==='clientes'&&!S.sel&&!(document.activeElement&&document.activeElement.id==='qc'))renderLogo()},()=>{});
  colRef('estoque').onSnapshot(snap=>{S.est=mesclarSnap('estoque',snap.docs.map(d=>({...d.data(),id:d.id})),S.est);LS.set(PFX+'cache-estoque',S.est);if(idle()&&S.vis==='estoque'&&!S.sel)renderLogo();else renderNav()},()=>{});

})();
