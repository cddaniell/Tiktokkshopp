<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>VetCamp · Ficha do animal</title>
<link rel="icon" href="icons/icon-192.png">
<style>
:root{--bg:#f6eee3;--card:#fbf6ef;--ink:#33210f;--mute:#76583d;--line:#d8c1a2;--act:#965a27;--ok:#2f7a3b;--warn:#b3242c;color-scheme:light dark}
@media(prefers-color-scheme:dark){:root{--bg:#1d1611;--card:#2a2018;--ink:#f3e6d6;--mute:#c9ab8c;--line:#4a3a2c;--act:#d99a5b;--ok:#7cc48a;--warn:#ff8a80}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:720px;margin:0 auto;padding:16px}
header.top{display:flex;gap:14px;align-items:center;margin:8px 0 16px}header.top img{width:72px;height:72px;border-radius:50%;object-fit:cover;border:2px solid var(--line)}
h1{font-size:26px;margin:0}h2{font-size:17px;margin:0 0 8px}.meta{color:var(--mute);font-size:14px}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:0 0 12px}
table{width:100%;border-collapse:collapse;font-size:15px}td,th{text-align:left;padding:6px 4px;border-bottom:1px solid var(--line);vertical-align:top}th{font-size:13px;color:var(--mute)}
.alert{border-left:4px solid var(--warn);padding:8px 10px;background:color-mix(in srgb,var(--warn) 10%,transparent);border-radius:8px;margin:0 0 8px}
.ok{color:var(--ok)}.late{color:var(--warn)}footer{text-align:center;font-size:13px;color:var(--mute);margin:20px 0}
.vazio{text-align:center;padding:40px 10px}
</style>
</head>
<body>
<main id="app"><p class="vazio">Carregando…</p></main>
<script src="firebase-config.js"></script>
<script src="portal.js"></script>
</body>
</html>
