<title>VetCamp</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
/* LAYOUT: barra de couro fixa com abas de seção; lista, agenda, quadro de internação, caixa, estoque, ferramentas e conta; ficha com abas roláveis; formulários em painel.
   COLOUR: marrom couro (marca), marrom claro (fundo, painéis), caramelo para ação. TYPE: Archivo + Atkinson Hyperlegible. */
:root{
 --bg:#f6eee3;--panel:#ecdcc6;--card:#fbf6ef;--line:#d8c1a2;--ink:#33210f;--mute:#76583d;
 --brand:#5b381b;--brandink:#f6e8d4;--bar:#5b381b;--barink:#f6e8d4;--act:#965a27;--actink:#ffffff;
 --s-tratamento:#a35400;--s-internado:#b3242c;--s-acompanhamento:#2a5ea8;--s-alta:#2d7445;--s-obito:#6b625a;--warn:#b3242c;--okc:#2d7445;
 --note:#f3e1bf;--shadow:rgb(60 35 15/.14);
 --display:Archivo,"Arial Narrow",system-ui,sans-serif;--body:"Atkinson Hyperlegible",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
 --bg:#1c140e;--panel:#2a1f16;--card:#231a12;--line:#4a3726;--ink:#f2e5d3;--mute:#bfa182;
 --brand:#c49a6c;--brandink:#1c140e;--bar:#3a2414;--barink:#e8c9a0;--act:#d99559;--actink:#1c140e;
 --s-tratamento:#f0a75a;--s-internado:#ff8086;--s-acompanhamento:#8db6ff;--s-alta:#78d49c;--s-obito:#b3aaa1;--warn:#ff8086;--okc:#78d49c;
 --note:#3a2a17;--shadow:rgb(0 0 0/.4);color-scheme:dark}}
:root[data-theme="dark"]{
 --bg:#1c140e;--panel:#2a1f16;--card:#231a12;--line:#4a3726;--ink:#f2e5d3;--mute:#bfa182;
 --brand:#c49a6c;--brandink:#1c140e;--bar:#3a2414;--barink:#e8c9a0;--act:#d99559;--actink:#1c140e;
 --s-tratamento:#f0a75a;--s-internado:#ff8086;--s-acompanhamento:#8db6ff;--s-alta:#78d49c;--s-obito:#b3aaa1;--warn:#ff8086;--okc:#78d49c;
 --note:#3a2a17;--shadow:rgb(0 0 0/.4);color-scheme:dark}
*{box-sizing:border-box;min-width:0}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 var(--body);overflow-x:clip}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bar)}
h1,h2,h3{font-family:var(--display);line-height:1.05;margin:0;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:3px solid var(--act);outline-offset:2px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bar);color:var(--barink);box-shadow:0 2px 8px var(--shadow)}
.topin{max-width:1100px;margin:0 auto;padding-block:10px 0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.toprow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.top h1{font-size:26px;font-weight:800;letter-spacing:.03em;flex:1;white-space:nowrap}
.top h1 small{display:block;font:400 13px var(--body);letter-spacing:0;opacity:.85}
.who{display:inline-flex;align-items:center;gap:8px;border:1px solid color-mix(in srgb,var(--barink) 35%,transparent);background:transparent;color:var(--barink);border-radius:99px;padding:4px 12px 4px 4px;min-height:40px;font-size:14px;font-weight:700}
.who img{width:30px;height:30px;border-radius:50%;flex:none}
.who .wn{max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.perfis{display:grid;gap:12px;margin:12px 0}
.perfil-op{display:grid;gap:6px;text-align:left;padding:18px;border:2px solid var(--line);border-radius:16px;background:var(--card);color:inherit;font:inherit;cursor:pointer}
.perfil-op:hover,.perfil-op:focus-visible{border-color:var(--act)}.perfil-op.atual{border-color:var(--act);background:color-mix(in srgb,var(--act) 8%,var(--card))}
.perfil-op .ic{font-size:34px;line-height:1}.perfil-op b{font-size:19px}.perfil-op span{color:var(--mute)}.perfil-op em{font-style:normal;font-weight:700;color:var(--act);font-size:13px}
@media(min-width:700px){.perfis{grid-template-columns:1fr 1fr}}
.alimb{grid-template-columns:repeat(auto-fill,minmax(min(100%,420px),1fr))}
.mini4{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:8px 0}.mini4>div{display:grid;gap:2px;background:var(--bg);border-radius:10px;padding:8px}.mini4 b{font-size:16px}.mini4 span{font-size:12px;color:var(--mute)}
.item.alim.falta{border-color:var(--warn)}
#notifbar{position:sticky;top:0;z-index:7;display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:10px max(16px,env(safe-area-inset-left,0px));background:var(--note,#f3e1bf);color:var(--ink);font-size:14px;border-bottom:1px solid var(--line)}
#notifbar .nbic{font-size:20px}#notifbar .nbtx{flex:1 1 220px}#notifbar .nbbt{display:flex;gap:6px;flex-wrap:wrap}
.galeria{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px;margin:0 0 12px}
.gfoto{position:relative;border:1px solid var(--line);border-radius:12px;padding:0;overflow:hidden;background:var(--bg);aspect-ratio:1;cursor:pointer}
.gfoto img{width:100%;height:100%;object-fit:cover;display:block}
.gfoto span{position:absolute;left:0;right:0;bottom:0;padding:4px 6px;font-size:12px;font-weight:700;color:#fff;background:linear-gradient(transparent,rgb(0 0 0/.7));text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fotobig img{width:100%;max-height:70vh;object-fit:contain;border-radius:12px;background:#000}
.comparar{display:grid;grid-template-columns:1fr 1fr;gap:8px}.comparar figure{margin:0}.comparar img{width:100%;aspect-ratio:3/4;object-fit:contain;border-radius:10px;background:#000}
.comparar figcaption{font-weight:700;font-size:14px;margin-top:4px}
.arvore{display:grid;gap:8px}.arvore>div{display:grid;gap:8px}.arvore .g2{grid-template-columns:1fr 1fr}.arvore .g3{grid-template-columns:repeat(2,1fr)}
@media(min-width:700px){.arvore{grid-template-columns:1fr 1fr 2fr;align-items:center}.arvore .g2{grid-template-columns:1fr}.arvore .g3{grid-template-columns:1fr 1fr}}
.gn{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--bg)}.gn span{display:block;font-size:12px;color:var(--mute)}
.tarefas{display:grid;gap:6px}.tarefa{display:flex;gap:10px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--bg)}
.tarefa>span{flex:1}.tarefa input{width:24px;height:24px;flex:none}.tarefa.feita b{text-decoration:line-through;opacity:.6}
.item.local.cheio{border-color:var(--warn)}
#lt_anim label{display:flex;align-items:center;gap:8px}#lt_anim select.ltres{margin-left:auto;min-height:34px}
.sec{border:1px solid var(--line);border-radius:14px;background:var(--card);margin:0 0 10px}
.sec>summary{list-style:none;display:flex;align-items:center;gap:10px;padding:14px 16px;cursor:pointer;min-height:52px}
.sec>summary::-webkit-details-marker{display:none}
.sec>summary .st{font-weight:800;font-size:16px}.sec>summary .sr{flex:1;min-width:0;color:var(--mute);font-size:13px;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sec>summary::after{content:"";width:9px;height:9px;flex:none;margin:-4px 4px 0 2px;border-right:2.5px solid currentColor;border-bottom:2.5px solid currentColor;transform:rotate(45deg);transition:transform .2s,margin .2s;opacity:.7}
.sec[open]>summary::after{transform:rotate(-135deg);margin-top:4px}
.sec[open]>summary{border-bottom:1px solid var(--line)}
.sec>.seccorpo{padding:14px 16px}
.sec>summary:focus-visible{outline:3px solid var(--act);outline-offset:2px;border-radius:14px}
.cols.secs{display:block}
.count.ctxt b{font-size:17px;line-height:1.25}
.barra{display:block;height:6px;border-radius:3px;margin-top:4px;background:linear-gradient(90deg,var(--act) var(--w),color-mix(in srgb,var(--act) 12%,transparent) var(--w))}
.lnk2{border:0;background:none;padding:0;color:var(--act);font:inherit;font-weight:700;text-decoration:underline;cursor:pointer;text-align:left}
.ag .lem{display:flex;gap:12px;align-items:center;flex:1;min-width:0}
body.prop :is([data-vis=caixa],[data-vis=orc],[data-vis=precos],[data-vis=intern],.soadmin,.sopresc,[data-rapido],[data-orcpac],[data-protapl],[data-tab=fin],.fichafin,[data-gerdoc]){display:none!important}
.who .espchip{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--act,#2b6);color:#fff;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.espaco{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line,#ddd4)}.espaco.atual b{color:var(--act)}
body.sem-fin :is(.fichafin,[data-tab=fin],[data-vis=caixa],[data-vis=relat],[data-pixpac],[data-despnova],[data-socios],[data-cortesia],[data-gerdoc=orcamento],[data-quick],[data-csv]){display:none!important}
body.sem-orc :is([data-vis=orc],[data-orcpac],[data-orcnovo]){display:none!important}
body.sem-admin :is([data-vis=precos],[data-importar],.soadmin){display:none!important}
body.sem-presc :is([data-add=meds],[data-edit=meds],[data-protapl],[data-tab=docs],[data-gerdoc]:not([data-gerdoc=orcamento]),.sopresc){display:none!important}
body.sem-clin :is(#novo,[data-add],[data-edit],[data-rapido],[data-aplic],[data-repetir],[data-agendar],[data-vis=estoque],[data-fotopac],[data-editp],[data-upload],[data-desfaz]){display:none!important}
body.sem-clin #st{pointer-events:none;opacity:.75}
body.sem-est [data-estnovo]{display:none!important}
@media(max-width:600px){.who .espchip{max-width:70px;font-size:10px}}
.who .dot{width:10px;height:10px;border-radius:50%;background:var(--barink);opacity:.5;margin-left:8px}
.nav{display:flex;gap:2px;overflow-x:auto;margin-top:8px;scrollbar-width:none}
.nav button{border:0;background:none;color:var(--barink);opacity:.78;min-height:42px;padding:0 12px;font-weight:700;border-bottom:3px solid transparent;white-space:nowrap;flex:none}
.nav button[aria-pressed=true]{opacity:1;border-color:var(--barink)}
.nav .badge{display:inline-block;min-width:20px;padding:0 6px;border-radius:99px;background:var(--barink);color:var(--bar);font-size:12px;margin-left:4px}
.navg{flex:none;display:flex}
.nav .navgb .seta{display:inline-block;width:7px;height:7px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(45deg);margin:0 2px 3px 8px;transition:transform .2s}
.nav .navg.aberto .navgb .seta{transform:rotate(-135deg);margin-bottom:-2px}
.nav .navgb .navsub{font-weight:600}
.nav .navg.aberto .navgb{opacity:1}
.navmenu{display:none;position:fixed;z-index:60;min-width:210px;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:14px;box-shadow:0 14px 34px rgb(0 0 0/.25);padding:6px;gap:2px}
.navg.aberto .navmenu{display:grid}
.nav .navmenu button.navit{color:var(--ink);opacity:1;border:0;border-left:3px solid transparent;text-align:left;border-radius:10px;min-height:46px;padding:0 14px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.nav .navmenu button.navit:hover,.nav .navmenu button.navit:focus-visible{background:color-mix(in srgb,var(--act) 8%,transparent)}
.nav .navmenu button.navit[aria-pressed=true]{background:color-mix(in srgb,var(--act) 14%,transparent);border-left-color:var(--act)}
.nav .navmenu .badge{background:var(--act);color:#fff}
.btn{min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-weight:700;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;text-decoration:none;color:var(--ink)}
.btn.pri{background:var(--act);color:var(--actink);border-color:transparent}
.btn.ghost{background:transparent}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px}
.btn.wa{color:var(--okc)}
.btn[disabled]{opacity:.5;cursor:default}
.wrap{max-width:1100px;margin:0 auto;padding-block:16px 80px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.note{display:none;margin:0 0 12px;padding:10px 14px;border-radius:10px;background:var(--note);font-size:14px}
.note.on{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.counts{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-bottom:12px}
.count{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--card);text-align:left;min-height:64px}
.count b{display:block;font:800 26px var(--display);font-variant-numeric:tabular-nums}
.count span{font-size:13px;color:var(--mute)}
.count[aria-pressed=true]{border-color:currentColor;box-shadow:inset 0 0 0 1px currentColor}
.search{width:100%;min-height:48px;padding:0 14px;border:1px solid var(--line);border-radius:12px;background:var(--card);font-size:16px;margin-bottom:12px}
.row{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:14px;margin-bottom:8px;background:var(--card);width:100%;text-align:left}
.row:hover{background:var(--panel)}
.av{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:var(--panel);font:800 15px var(--display);color:var(--brand);border:2px solid var(--line);flex:none;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.fotobtn{position:relative;border:0;background:none;padding:0;border-radius:50%;flex:none}
.fotobtn .cam{position:absolute;left:50%;bottom:-6px;transform:translateX(-50%);background:var(--act);color:var(--actink);font-size:11px;font-weight:700;padding:1px 7px;border-radius:99px;white-space:nowrap}
.fotobtn.grande .av{width:88px;height:88px;font-size:30px}
.perfil{display:flex;gap:18px;align-items:center;flex-wrap:wrap}.perfil .grow{flex:1 1 220px}
.mini{width:26px;height:26px;border-radius:50%;object-fit:cover;vertical-align:-7px;margin-right:6px}
.who img{object-fit:cover}
.row h3{font-size:18px}
.meta{font-size:14px;color:var(--mute)}
.pill{display:inline-block;padding:3px 10px;border-radius:99px;font-size:13px;font-weight:700;white-space:nowrap;color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent)}
.flag{display:inline-block;font:700 12px var(--body);color:var(--warn);margin-left:6px}
.empty{padding:28px 16px;text-align:center;color:var(--mute);border:2px dashed var(--line);border-radius:16px;margin-bottom:12px}
.empty h2{color:var(--ink);font-size:24px;margin-bottom:8px}
.ag{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;border-bottom:1px solid var(--line)}
.ag>button{display:grid;grid-template-columns:96px minmax(0,1fr);gap:12px;padding:12px 4px;text-align:left;background:none;border:0;width:100%}
.ag>button:hover{background:var(--panel)}
.ag .d{font:800 18px var(--display);white-space:nowrap;font-variant-numeric:tabular-nums}
.ag .d small{display:block;font:700 12px var(--body);color:var(--mute)}
.ag.late .d,.ag.late .d small{color:var(--warn)}
.dayh{font:800 15px var(--display);color:var(--brand);margin:18px 0 4px;text-transform:uppercase;letter-spacing:.06em}
.head{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap;margin:8px 0 14px}
.head .av{width:64px;height:64px;font-size:20px}
.head h2{font-size:clamp(28px,6vw,40px)}
.head .grow{flex:1}
.stsel{min-height:44px;border-radius:10px;border:2px solid var(--c);color:var(--c);background:var(--card);font-weight:700;padding:0 10px}
.tabs{display:flex;gap:2px;overflow-x:auto;border-bottom:2px solid var(--line);margin-bottom:16px;scrollbar-width:thin}
.tab{border:0;background:none;padding:10px 12px;min-height:44px;font-weight:700;color:var(--mute);border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap;flex:none}
.tab[aria-selected=true]{color:var(--ink);border-color:var(--act)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin-bottom:16px}
.vit{background:var(--panel);border-radius:12px;padding:10px 12px}
.vit span{font-size:13px;color:var(--mute);display:block}
.vit b{font:800 22px var(--display);white-space:nowrap;font-variant-numeric:tabular-nums}
.vit small{display:block;font-size:12px;color:var(--mute)}
.vit.out{background:color-mix(in srgb,var(--warn) 12%,transparent)}.vit.out b{color:var(--warn)}
.alert{border-left:4px solid var(--warn);background:color-mix(in srgb,var(--warn) 9%,transparent);padding:10px 14px;border-radius:0 10px 10px 0;margin-bottom:8px}
.info{border-left:4px solid var(--s-acompanhamento);background:color-mix(in srgb,var(--s-acompanhamento) 9%,transparent);padding:10px 14px;border-radius:0 10px 10px 0;margin-bottom:8px}
.box{border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;background:var(--card)}
.box h3{font-size:16px;margin-bottom:8px}
.box p{margin:0 0 6px;white-space:pre-wrap}
.lbl{font-size:13px;font-weight:700;color:var(--mute);display:block}
.fig{position:relative;height:170px}.fig>svg{position:absolute;inset:0;width:100%;height:100%}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.bar h3,.bar h2{font-size:20px}
.hint{font-size:13px;color:var(--mute);margin:-4px 0 12px}
.item{border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px;background:var(--card)}
.item header{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:6px}
.item h3{font-size:17px}
.item .vl{font-size:14px;color:var(--mute);margin-bottom:6px}
.item p{margin:0 0 8px;white-space:pre-wrap}
.btns{display:flex;gap:6px;flex-wrap:wrap}
.late{color:var(--warn);font-weight:700}
.ok{color:var(--okc);font-weight:700}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse}
td,th{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:13px;color:var(--mute)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.calc .f{margin-bottom:10px}
.res{font:800 24px var(--display);color:var(--brand);font-variant-numeric:tabular-nums}
.res small{font:400 14px var(--body);color:var(--mute);display:block}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.thumb{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card)}
.thumb img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;max-width:100%}
.thumb .ph{aspect-ratio:4/3;display:grid;place-items:center;background:var(--panel);font:800 20px var(--display);color:var(--brand)}
.thumb div.t{padding:8px;font-size:13px}
.sheet{position:fixed;inset:0;z-index:20;background:rgb(0 0 0/.45);display:none;align-items:flex-end;justify-content:center}
.sheet.on{display:flex}
.card{background:var(--bg);width:min(720px,100%);max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding-block:18px calc(24px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media(min-width:700px){.sheet{align-items:center}.card{border-radius:18px;padding-left:24px;padding-right:24px}}
.card h2{font-size:24px;margin-bottom:12px}
.f{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 12px}
.fld{grid-column:span 2}.fld.h{grid-column:span 1}
.sec{grid-column:span 2;font-size:15px;color:var(--brand);border-top:1px solid var(--line);padding-top:12px;margin-top:4px}
.fld>label{font-size:14px;font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:6px;margin-bottom:4px}
.fld input:not([type=checkbox]),.fld select,.fld textarea{width:100%;min-height:44px;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);font-size:16px}
.fld textarea{min-height:84px;resize:vertical}
textarea.doc{width:100%;min-height:340px;font:15px/1.5 var(--body);padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
.ck{display:flex;flex-wrap:wrap;gap:6px}
.ck label{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:99px;padding:6px 12px;min-height:40px;font-size:14px;background:var(--card)}
.ck input{width:18px;height:18px;accent-color:var(--act)}
.mic{border:1px solid var(--line);background:var(--card);border-radius:99px;min-height:32px;padding:0 10px;font-size:13px;font-weight:700}
.mic.on{background:var(--act);color:var(--actink)}
.acts{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.acts .del{margin-right:auto;color:var(--warn)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
.steps{margin:0;padding-left:20px}.steps li{margin-bottom:6px}
.link{font-family:ui-monospace,monospace;font-size:14px;background:var(--panel);padding:8px 10px;border-radius:8px;word-break:break-all;user-select:all}
@media(max-width:600px){.head .grow{flex:1 1 calc(100% - 80px)}.head .stsel,.head>.btns{width:100%}.row{grid-template-columns:40px minmax(0,1fr)}.row .av{width:40px;height:40px}.row .end{grid-column:2}.fld.h{grid-column:span 2}.ag>button{grid-template-columns:76px minmax(0,1fr)}.top h1 small{display:none}}

.brandrow{display:flex;align-items:center;gap:10px;flex:1 1 auto;min-width:max-content}

.nav .navmenu button.navit .nvt{flex:1;text-align:left}
/* computador: logo e nome maiores à esquerda, perfil/busca/+Paciente no canto direito e as seções numa barra lateral */
@media(min-width:1000px){
  :root{--lat:236px}
  .topin{max-width:none;padding-block:12px}
  .top .logo{width:58px;height:58px}
  .top h1{font-size:32px}.top h1 small{font-size:14px}
  .toprow{flex-wrap:nowrap;gap:12px}
  .nav{position:fixed;left:0;top:var(--toph,82px);bottom:0;width:var(--lat);margin:0;flex-direction:column;gap:2px;overflow-y:auto;overflow-x:hidden;padding:14px 10px 24px;background:var(--bar);box-shadow:2px 0 8px var(--shadow);z-index:4}
  .nav button{width:100%;text-align:left;border:0;border-left:3px solid transparent;border-radius:10px;min-height:46px;padding:0 12px;display:flex;align-items:center;font-size:15px}
  .nav button:hover{opacity:1;background:color-mix(in srgb,var(--barink) 10%,transparent)}
  .nav button[aria-pressed=true]{opacity:1;background:color-mix(in srgb,var(--barink) 16%,transparent);border-left-color:var(--barink)}
  .nav .nvi{width:20px;height:20px;margin-right:12px}

const optsDe=(m,k)=>{const f=m.f.find(x=>x.k===k);const l=f&&(f.o||(typeof f.list==='function'?f.list({}):f.list));return (l||[]).filter(x=>typeof x==='string'&&x)};

const TIPOFIN={meds:'Medicamento / produto',exames:'Exame',oficiais:'Exame',evolucao:'Internação (diária)',consultas:'Serviço'};
function syncFin(p){
  const want=new Map();
  for(const m of MODS){if(SEMVALOR.includes(m.key))continue;for(const it of (p[m.key]||[])){
    const v=valorItem(m,it),dk=m.dateK||'data',n=(it.aplic||[]).length;
    if(v>0)want.set(it.id,{mod:m.key,tipo:TIPOFIN[m.key]||'Serviço',data:it[dk]||hoje(),desc:m.tab+': '+tituloIt(m,it)+(m.key==='meds'&&num(it.valorAplic)?` (${n} aplicação(ões) × ${R$(it.valorAplic)}${num(it.valor)?' + medicamento '+R$(it.valor):''})`:''),total:v,...(it.por?{por:it.por}:{})});
    if(m.key==='consultas'&&num(it.kmrod)&&num(S.cfg.kmval))want.set(it.id+'-km',{mod:'consultas',tipo:'Deslocamento (km)',data:it.data||hoje(),desc:'Deslocamento: '+it.kmrod+' km',total:num(it.kmrod)*num(S.cfg.kmval),qtd:String(it.kmrod),unit:String(S.cfg.kmval)});
  }}
  const out=[];
  for(const f of (p.fin||[])){
    if(!f.ref){out.push(f);continue}
    const w=want.get(f.ref);
    if(!w){if(num(f.pago)>0)out.push({...f,orfao:1});continue}
    want.delete(f.ref);const pago=num(f.pago);
    out.push({...f,...w,auto:1,qtd:w.qtd||'1',unit:w.unit||String(w.total),total:String(w.total),desconto:'',sit:f.sit==='Orçamento'?'Orçamento':pago>=w.total?'Pago':pago>0?'Parcial':'Pendente'});
  }
  for(const [ref,w] of want)out.push({id:uid(),ref,auto:1,...w,qtd:w.qtd||'1',unit:w.unit||String(w.total),total:String(w.total),sit:'Pendente',pago:''});
  return {...p,fin:out};
}

  const tot=l.reduce((s,x)=>s+num(x.total),0),ab=l.reduce((s,x)=>s+saldo(x),0),orc=(p.fin||[]).filter(x=>x.sit==='Orçamento').reduce((s,x)=>s+num(x.total),0);

}

function enviar(col,id,body,del){
  const k=col+'/'+id,op={col,id,body,del:!!del,t:Date.now()};
  if(!navigator.onLine){enfileirar(op);return Promise.resolve()}
  // várias gravações seguidas do mesmo registro viram uma só (evita sobrecarga e cobrança extra)
  const jaNaFila=k in ultimo;ultimo[k]=op;emVoo.add(k);
  if(jaNaFila)return queue[k];
  queue[k]=(queue[k]||Promise.resolve()).then(async()=>{await new Promise(r=>setTimeout(r,150));const o=ultimo[k];delete ultimo[k];
    try{if(o.del)await colRef(col).doc(id).delete();else await colRef(col).doc(id).set(o.body)}catch(e){if(e&&PERM.includes(e.code))toast(errMsg(e));else enfileirar(o)}finally{if(!(k in ultimo))emVoo.delete(k)}});
  return queue[k];
}

function permitido(t){
  const d=t.dataset;
  if(d.add||d.edit){const k=d.add||d.edit;return k==='fin'?pode('financeiro'):k==='meds'?pode('prescrever'):pode('clinico')}
  if(t.id==='novo'||'rapido' in d||'aplic' in d&&d.aplic||'repetir' in d||'agendar' in d||'fotopac' in d||'editp' in d||'upload' in d||'desfaz' in d&&d.desfaz)return pode('clinico');
  if('protapl' in d||'assinvet' in d)return pode('prescrever');
  if(d.gerdoc)return d.gerdoc==='orcamento'?pode('financeiro'):pode('prescrever');
  if('pixpac' in d||'socios' in d||'despnova' in d||'cortesia' in d&&d.cortesia||'quick' in d&&d.quick)return pode('financeiro');
  if('orcpac' in d||'orcnovo' in d)return pode('orcamentos');
  if('estnovo' in d)return pode('estoqueCad');
  if('importar' in d)return pode('admin');
  if(d.vis)return visOk(d.vis);
  return true;
}

    CLIN.eu=eu;CLIN.papel=eu.papel;LS.set('vetcamp-espaco-'+uid,{cid:CLIN.cid,nome:CLIN.nome,eu});

async function aceitarConvite(cv){
  if(AUTH&&AUTH.verificado&&!AUTH.verificado()){toast('Confirme seu e-mail antes de aceitar (veja a mensagem que enviamos).');return}
  const uid=meId(),nome=(CLIN?CLIN.eu.nome:S.cfg.apelido)||me.name||me.email;
  const base={uid,papel:cv.papel,nome:String(nome).slice(0,120),email:String(me.email||'').toLowerCase(),verFinanceiro:!!cv.verFinanceiro,desde:Date.now()};
  const pes=meusPessoais();if(!ehVetPapel(cv.papel))for(const k of ['vet','crmv','cpfvet','assinVet'])delete pes[k];
  try{await db.doc(`clinicas/${cv.cid}/membros/${uid}`).set({...base,...pes});
    await db.doc(`usuarios/${uid}/clinicas/${cv.cid}`).set({nome:cv.clinicaNome||'Clínica',papel:cv.papel,desde:Date.now()});

  catch(e){toast(e&&PERM.includes(e.code)?'Convite inválido ou já usado. Peça ao dono para convidar de novo.':errMsg(e))}

async function criarClinica(nome,copiar){
  if(CLIN){toast('Volte ao espaço pessoal para criar uma clínica.');return}
  const uid=meId(),cid=db.collection('clinicas').doc().id,agora=Date.now();
  const b=$('eqcriar');if(b){b.disabled=true;b.textContent='Criando…'}
  try{
    try{const d=await cfgRef().get();if(d.exists)S.cfg={...d.data(),...S.cfg}}catch(e){}
    await db.doc('clinicas/'+cid).set({nome,dono:uid,criada:agora});
    await db.doc(`clinicas/${cid}/membros/${uid}`).set({uid,papel:'dono',nome:String(S.cfg.apelido||me.name||me.email||'Dono').slice(0,120),email:String(me.email||'').toLowerCase(),verFinanceiro:true,desde:agora,...meusPessoais()});
    await db.doc(`usuarios/${uid}/clinicas/${cid}`).set({nome,papel:'dono',desde:agora});
    const cfgC={...S.cfg};for(const k of PES_VET)if(k!=='vet'&&k!=='crmv'&&k!=='cpfvet')delete cfgC[k];cfgC.clinica=nome;
    const raiz=`clinicas/${cid}/app/samvet`;
    await db.doc(raiz+'/config/clinica').set(cfgC);
    if(copiar){
      const ops=[];for(const [col,a] of Object.entries(COLS))for(const x of S[a]){const body=JSON.parse(JSON.stringify(x));delete body.id;ops.push([`${raiz}/${col}/${x.id}`,body])}
      for(let i=0;i<ops.length;i+=100){const bt=db.batch();for(const [pth,body] of ops.slice(i,i+100))bt.set(db.doc(pth),body);await bt.commit();if(b)b.textContent=`Copiando… ${Math.min(i+100,ops.length)}/${ops.length}`}
    }
    toast('Clínica criada');trocarEspaco({cid,nome});
  }catch(e){toast(errMsg(e));if(b){b.disabled=false;b.textContent='Criar clínica'}}
}

function compactarConta(){
  const v=$('view'),abertas=LS.get('vetcamp-conta-abertas',[]);
  const boxes=[...v.querySelectorAll(':scope > .box, :scope > .cols > .box')].filter(b=>!b.classList.contains('perfil')&&!b.classList.contains('perfiltipo'));
  for(const b of boxes){
    const h=b.querySelector('h3');if(!h)continue;const tit=h.textContent.trim();if(!tit)continue;
    const bar=h.parentElement.classList.contains('bar')?h.parentElement:null;
    const d=document.createElement('details');d.className='sec '+[...b.classList].filter(c=>['soadmin','sopresc'].includes(c)).join(' ');d.dataset.sec=tit;
    const sm=document.createElement('summary');const r=CONTA_RESUMO[tit]||(()=>'');let res='';try{res=r()}catch(e){}
    sm.innerHTML=`<span class="st"></span><span class="sr"></span>`;sm.querySelector('.st').textContent=tit;sm.querySelector('.sr').textContent=res||'';
    if(bar&&bar.children.length===1)bar.remove();else h.remove();
    b.before(d);b.classList.remove('box');b.classList.add('seccorpo');d.append(sm,b);if(abertas.includes(tit))d.open=true;
    d.addEventListener('toggle',()=>{const l=LS.get('vetcamp-conta-abertas',[]).filter(x=>x!==tit);if(d.open)l.push(tit);LS.set('vetcamp-conta-abertas',l)});
  }
  const cols=v.querySelector(':scope > .cols');if(cols&&!cols.querySelector('.box'))cols.classList.add('secs');
}

const mesesAte=(m,n)=>{const out=[];let [y,mo]=m.split('-').map(Number);for(let i=0;i<n;i++){out.unshift(`${y}-${String(mo).padStart(2,'0')}`);mo--;if(!mo){mo=12;y--}}return out};
const nomeMesC=m=>new Date(m+'-15T12:00:00').toLocaleDateString('pt-BR',{month:'short'}).replace('.','');
function renderRelat(){
  const mes=S.relMes||hoje().slice(0,7),L=lancamentos().filter(x=>x.f.sit!=='Orçamento');
  const despP=despMes(mes).filter(x=>x.sit!=='A pagar').reduce((s,x)=>s+num(x.valor),0);
  const doMes=L.filter(x=>(x.f.data||'').startsWith(mes));
  const fat=doMes.reduce((s,x)=>s+num(x.f.total),0),rec=doMes.reduce((s,x)=>s+num(x.f.pago),0);
  const custo=S.est.reduce((s,it)=>s+(it.mov||[]).filter(m=>m.q<0&&String(m.d).slice(0,7)===mes).reduce((t,m)=>t-m.q*num(it.custo),0),0);
  const atend=S.pac.flatMap(p=>(p.consultas||[]).filter(c=>(c.data||'').startsWith(mes)));
  const pacM=new Set(S.pac.filter(p=>MODS.some(m=>(p[m.key]||[]).some(it=>String(it[m.dateK||'data']||'').startsWith(mes)))).map(p=>p.id));
  const novos=S.pac.filter(p=>p.criado&&new Date(p.criado).toISOString().slice(0,7)===mes).length;
  const meses=mesesAte(mes,12),serie=meses.map(m=>({m,v:L.filter(x=>(x.f.data||'').startsWith(m)).reduce((s,x)=>s+num(x.f.total),0)}));
  const grp=(arr,kf)=>{const g={};for(const x of arr){const k=kf(x);(g[k]=g[k]||{n:0,v:0});g[k].n++;g[k].v+=num(x.f.total)}return Object.entries(g).sort((a,b)=>b[1].v-a[1].v)};
  const porSec=grp(doMes,x=>secaoFin(x.f)),porCli=grp(doMes,x=>nomeCli(x.p)).slice(0,10);
  const porTipo={};for(const c of atend)porTipo[c.tipo||'Consulta']=(porTipo[c.tipo||'Consulta']||0)+1;

function desenhaBarras(s,serie,sel){
  const draw=()=>{const W=s.clientWidth,H=s.clientHeight;if(!W)return;const pl=8,pr=8,pt=24,pb=26,mx=Math.max(...serie.map(x=>x.v),1);
    const ticks=[0,mx/2,mx],bw=(W-pl-pr)/serie.length,Y=v=>H-pb-(v/mx)*(H-pt-pb);
    let g=ticks.map(t=>`<line x1="${pl}" x2="${W-pr}" y1="${Y(t)}" y2="${Y(t)}" stroke="var(--line)" stroke-width="1"/>`).join('');
    g+=serie.map((x,i)=>{const x0=pl+i*bw+bw*0.18,w=Math.max(4,bw*0.64),y=Y(x.v),h=H-pb-y,r=Math.min(4,w/2,h);const on=x.m===sel;
      const path=h>0?`M${x0},${H-pb} V${y+r} Q${x0},${y} ${x0+r},${y} H${x0+w-r} Q${x0+w},${y} ${x0+w},${y+r} V${H-pb} Z`:'';
      return `<g class="hb"><rect x="${pl+i*bw}" y="${pt-20}" width="${bw}" height="${H-pt+20}" fill="transparent"><title>${nomeMesC(x.m)} ${x.m.slice(0,4)}: ${R$(x.v)}</title></rect>${path?`<path d="${path}" fill="${on?'var(--act)':'var(--brand)'}" opacity="${on?1:.75}" pointer-events="none"/>`:''}
      <text x="${x0+w/2}" y="${H-8}" text-anchor="middle" font-size="12" fill="${on?'var(--ink)':'var(--mute)'}" font-weight="${on?700:400}">${nomeMesC(x.m)}</text>${on&&x.v?`<text x="${x0+w/2}" y="${y-6}" text-anchor="middle" font-size="12" font-weight="700" fill="var(--ink)">${R$(x.v).replace(',00','')}</text>`:''}</g>`}).join('');
    s.innerHTML=g};
  new ResizeObserver(draw).observe(s);
}
function csvLanc(){
  const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';

}

function padAssin(el){
  el.innerHTML=`<canvas width="600" height="180" class="pad" aria-label="Área para assinar com o dedo ou o mouse"></canvas><div class="btns"><button type="button" class="btn sm ghost">Limpar</button></div>`;
  const cv=el.querySelector('canvas'),cx=cv.getContext('2d');let des=false,tem=false,last=null;
  cx.lineWidth=2.6;cx.lineCap='round';cx.lineJoin='round';cx.strokeStyle='#1a1410';
  const pt=e=>{const r=cv.getBoundingClientRect();return[(e.clientX-r.left)*cv.width/r.width,(e.clientY-r.top)*cv.height/r.height]};
  cv.addEventListener('pointerdown',e=>{des=true;last=pt(e);cv.setPointerCapture(e.pointerId);e.preventDefault()});
  cv.addEventListener('pointermove',e=>{if(!des)return;const p=pt(e);cx.beginPath();cx.moveTo(...last);cx.lineTo(...p);cx.stroke();last=p;tem=true});
  ['pointerup','pointercancel'].forEach(t=>cv.addEventListener(t,()=>des=false));
  el.querySelector('button').onclick=()=>{cx.clearRect(0,0,cv.width,cv.height);tem=false};
  return{vazio:()=>!tem,blob:()=>new Promise(r=>cv.toBlob(r,'image/png')),url:()=>cv.toDataURL('image/png')};
}
async function guardarAssin(pad){
  if(pad.vazio())return null;

}

function orcTotais(o){
  // nada negativo: quantidade, preço, desconto (até 100%) e km
  const pos=v=>Math.max(0,num(v));
  const its=(o.itens||[]).filter(i=>i.desc);const sub=its.reduce((s,i)=>s+pos(i.qtd||1)*pos(i.unit),0);
  const desc=o.descTipo==='%'?sub*Math.min(100,pos(o.descValor))/100:pos(o.descValor);
  const km=pos(o.km)*pos(o.kmval!==undefined&&o.kmval!==''?o.kmval:S.cfg.kmval);
  return{its,sub,desc:Math.min(desc,sub),km,total:Math.max(0,sub-Math.min(desc,sub)+km)};
}

function nomesAnimais(txt){return String(txt||'').replace(/\([^)]*\)/g,'').split(/\s*[,;/]\s*|\s+e\s+/).map(x=>x.trim()).filter(Boolean)}

function lancarOrc(q,o,t){
  const novos=t.its.map(i=>({id:uid(),data:hoje(),tipo:'Serviço',desc:i.desc+' ('+o.numero+')',qtd:String(num(i.qtd||1)),unit:String(num(i.unit)),total:String(num(i.qtd||1)*num(i.unit)),sit:'Pendente',pago:'',orc:o.id,por:meId()}));
  let resto=t.desc;for(const e of [...novos].sort((a,b)=>num(b.total)-num(a.total))){if(resto<=0)break;const ab=Math.min(resto,num(e.total));e.desconto=String(ab);e.total=String(num(e.total)-ab);resto-=ab}
  if(t.km)novos.push({id:uid(),data:hoje(),tipo:'Deslocamento (km)',desc:'Deslocamento ('+o.km+' km) · '+o.numero,qtd:String(num(o.km)),unit:String(num(o.kmval||S.cfg.kmval)),total:String(t.km),sit:'Pendente',pago:'',orc:o.id});
  return{...q,fin:[...(q.fin||[]).filter(f=>f.orc!==o.id),...novos]};
}

/* Pix (BR Code) */
function crc16(s){let c=0xFFFF;for(const ch of new TextEncoder().encode(s)){c^=ch<<8;for(let i=0;i<8;i++)c=(c&0x8000)?((c<<1)^0x1021)&0xFFFF:(c<<1)&0xFFFF}return c.toString(16).toUpperCase().padStart(4,'0')}
function chavePix(){const c=S.cfg,k=String(c.pix||'').trim(),tipo=c.pixTipo||'';if(!k)return'';
  if(tipo==='E-mail'||k.includes('@'))return k.toLowerCase();
  if(tipo==='Aleatória'||/^[0-9a-f]{8}-[0-9a-f]{4}-/i.test(k))return k.toLowerCase();
  const dg=k.replace(/\D/g,'');
  if(tipo==='Celular'||k.startsWith('+'))return '+'+(dg.length>=12&&dg.startsWith('55')?dg:'55'+dg);
  return dg||k;}
function pixPayload(valor,txid){
  const f=(id,v)=>id+String(v.length).padStart(2,'0')+v;
  const limpa=(s,n)=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^A-Za-z0-9 ]/g,'').toUpperCase().replace(/\s+/g,' ').trim().slice(0,n)||'VETCAMP';
  const c=S.cfg,cidade=String(c.pixCidade||c.cidade||'').split('/')[0];
  let p=f('00','01')+f('26',f('00','br.gov.bcb.pix')+f('01',chavePix()))+f('52','0000')+f('53','986')+(valor>0?f('54',(+valor).toFixed(2)):'')+f('58','BR')+f('59',limpa(c.pixNome||c.vet||c.clinica,25))+f('60',limpa(cidade,15))+f('62',f('05',String(txid||'***').replace(/[^A-Za-z0-9]/g,'').slice(0,25)||'***'));
  p+='6304';return p+crc16(p);

function editarSocios(p){
  const l=(p.socios&&p.socios.length?p.socios:[{nome:nomeCli(p),tel:p.tel||'',pct:'100'}]).map(x=>({...x}));
  const linha=(x,i)=>`<div class="sline"><input data-f="nome" placeholder="Nome" aria-label="Nome" value="${esc(x.nome||'')}"><input data-f="tel" type="tel" placeholder="Telefone" aria-label="Telefone" value="${esc(x.tel||'')}"><input data-f="pct" type="number" step="any" min="0" max="100" inputmode="decimal" aria-label="Porcentagem" value="${esc(x.pct||'')}"><span class="meta">%</span><button type="button" class="x" data-rmsoc="${i}" aria-label="Remover">×</button></div>`;
  const ler=()=>[...$('card').querySelectorAll('.sline')].map(r=>{const o={};r.querySelectorAll('[data-f]').forEach(e=>o[e.dataset.f]=e.value.trim());return o}).filter(o=>o.nome);
  const draw=ls=>{$('card').innerHTML=`<h2>Dividir entre responsáveis · ${esc(p.nome)}</h2><p class="hint">Para animais com mais de um dono. Cada um recebe a cobrança da sua parte. A soma precisa dar 100%.</p><div id="socs">${ls.map(linha).join('')}</div><button type="button" class="btn sm" id="addsoc">+ Responsável</button><p class="meta" id="somasoc"></p>
    <div class="acts">${p.socios&&p.socios.length?'<button type="button" class="btn ghost del" id="del">Não dividir</button>':''}<button type="button" class="btn" id="cancel">Cancelar</button><button type="button" class="btn pri" id="socok">Salvar divisão</button></div>`;
    const soma=()=>{const s=ler().reduce((a,x)=>a+num(x.pct),0);$('somasoc').textContent='Soma: '+fx(s,2)+'%';$('somasoc').className=Math.abs(s-100)<.01?'ok':'late';return s};
    $('card').oninput=()=>{if($('somasoc'))soma()};soma();
    $('addsoc').onclick=()=>draw([...ler(),{nome:'',tel:'',pct:''}]);
    $('card').querySelectorAll('[data-rmsoc]').forEach(b=>b.onclick=()=>{const x=ler();x.splice(+b.dataset.rmsoc,1);draw(x.length?x:[{nome:'',pct:'100'}])});
    $('cancel').onclick=fechar;
    if($('del'))$('del').onclick=()=>{const q={...p};delete q.socios;salvar(q);fechar();toast('Divisão removida')};
    $('socok').onclick=()=>{const x=ler();if(x.length<2){toast('Coloque pelo menos dois responsáveis');return}if(Math.abs(soma()-100)>=.01){toast('A soma das porcentagens precisa dar 100%');return}salvar({...p,socios:x});fechar();toast('Divisão salva')};
  };
  $('sheet').classList.add('on');draw(l);
}

/* custo de cada animal: gastos diretos + gastos gerais divididos */
function custoPorAnimal(lista){
  const at=S.pac.filter(ativo),r={};const add=(id,v)=>{r[id]=(r[id]||0)+v};
  for(const x of lista){const v=num(x.valor);if(!v)continue;
    if(x.animalId&&x.animalId!=='varios'){add(x.animalId,v);continue}
    let alvo=x.animalId==='varios'?at.filter(p=>ARR(x.animais).includes(p.nome)):at;if(!alvo.length)alvo=at;
    if(!alvo.length){add('',v);continue}for(const p of alvo)add(p.id,v/alvo.length)}
  return r;
}

/* desfazer */
let desfazerTimer=null;
function desfazivel(msg,restaurar){
  let el=$('desfazer');if(!el){el=document.createElement('div');el.id='desfazer';el.className='desfazer';el.setAttribute('role','status');document.body.appendChild(el)}
  el.innerHTML=`<span></span><button type="button" class="btn sm">Desfazer</button>`;el.querySelector('span').textContent=msg;el.hidden=false;
  el.querySelector('button').onclick=()=>{clearTimeout(desfazerTimer);el.hidden=true;restaurar();toast('Desfeito')};
  clearTimeout(desfazerTimer);desfazerTimer=setTimeout(()=>{el.hidden=true},7000);
}
/* busca em tudo */
const semAcento=x=>String(x||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
function buscarTudo(q){
  const t=semAcento(q).trim();if(t.length<2)return[];
  const r=[],tem=(...v)=>semAcento(v.join(' ')).includes(t);
  for(const p of S.pac){if(tem(p.nome,p.tutor,p.raca,p.chip,p.registro,p.prop,p.pelagem))r.push({tipo:'Animal',tit:p.nome,sub:[p.especie,p.raca,p.tutor].filter(Boolean).join(' · '),abrir:{id:p.id}});
    for(const m of MODS)for(const it of (p[m.key]||[]))if(tem(...Object.values(it).filter(v=>typeof v==='string'&&v.length<400)))r.push({tipo:m.tab,tit:`${p.nome} · ${tituloIt(m,it)}`,sub:br(it[m.dateK||'data']),abrir:{id:p.id,tab:m.key}})}
  for(const c of S.cli)if(tem(c.nome,c.doc,c.tel,c.cidade,c.contato))r.push({tipo:'Cliente',tit:c.nome,sub:[c.tipo,c.cidade,c.tel].filter(Boolean).join(' · '),abrir:{cli:c.id}});
  for(const o of S.orc)if(tem(o.numero,o.cliente,o.animal))r.push({tipo:'Orçamento',tit:`${o.numero} · ${o.cliente}`,sub:br(o.data)+' · '+R$(orcTotais(o).total),abrir:{orc:o.id}});
  for(const x of S.est)if(tem(x.nome,x.lote,x.forn))r.push({tipo:'Estoque',tit:x.nome,sub:fx(num(x.qtd),2)+' '+(x.un||''),abrir:{vis:'estoque'}});
  return r.slice(0,60);
}
function abrirBusca(){
  $('card').innerHTML=`<h2>Buscar no VetCamp</h2><input class="search" id="bq" type="search" placeholder="Animal, tutor, cliente, diagnóstico, orçamento, produto…" aria-label="Buscar em tudo" autocomplete="off"><div id="bres"><p class="meta">Digite pelo menos 2 letras. Dica: no computador, aperte <b>/</b> para abrir a busca.</p></div><div class="acts"><button class="btn" id="cancel">Fechar</button></div>`;
  $('sheet').classList.add('on');$('cancel').onclick=fechar;
  const mostrar=()=>{const l=buscarTudo($('bq').value);$('bres').innerHTML=$('bq').value.trim().length<2?'<p class="meta">Digite pelo menos 2 letras.</p>':l.length?l.map((x,i)=>`<button class="row" data-bres="${i}"><span class="av">${esc(x.tipo.slice(0,2))}</span><span><h3>${esc(x.tit)}</h3><span class="meta">${esc(x.tipo)} · ${esc(x.sub||'')}</span></span></button>`).join(''):'<p class="meta">Nada encontrado.</p>';
    $('bres').querySelectorAll('[data-bres]').forEach(b=>b.onclick=()=>{const a=l[+b.dataset.bres].abrir;$('sheet').classList.remove('on');
      if(a.id){S.sel=a.id;S.tab=a.tab||'resumo';render();scrollTo(0,0)}else if(a.cli){S.sel=null;S.vis='clientes';S.cliSel=a.cli;render()}else if(a.orc){S.sel=null;S.vis='orc';render();const o=S.orc.find(x=>x.id===a.orc);if(o)verOrc(o)}else if(a.vis){S.sel=null;S.vis=a.vis;render()}})};
  $('bq').oninput=mostrar;setTimeout(()=>$('bq').focus(),30);
}
/* linha do tempo do animal */
function resumoTutor(p,it){const c=S.cfg;return `Olá, ${p.tutor||''}! Aqui é da ${c.clinica||'VetCamp'}. Resumo do atendimento de ${p.nome} em ${br(it.data)}:${it.diag?'\n\nDiagnóstico: '+it.diag:''}${it.trat?'\n\nTratamento: '+it.trat:''}${it.orient?'\n\nOrientações: '+it.orient:''}${it.retorno?'\n\nRetorno: '+br(it.retorno):''}\n\nQualquer dúvida, é só chamar.${c.vet?'\n'+c.vet+(c.crmv?' · CRMV '+c.crmv:''):''}`}
function linhaTempo(p){
  const ev=[];
  for(const m of MODS)if(modVis(m,p))for(const it of (p[m.key]||[])){const d=it[m.dateK||'data'];if(!d)continue;
    const extra=m.key==='consultas'?[it.diag,it.queixa].filter(Boolean).join(' · '):m.key==='meds'?[it.dose,it.via,(it.aplic||[]).length?(it.aplic.length+' aplicação(ões)'):''].filter(Boolean).join(' · '):m.key==='fin'?R$(it.total)+(saldo(it)?' · em aberto':' · pago'):(it.obs||it.res||it.diag||it.resultado||'');
    ev.push({d,h:it.hora||'',tipo:m.tab,tab:m.key,tit:tituloIt(m,it),extra})}
  for(const d of (p.docs||[]))ev.push({d:d.data,h:'',tipo:'Documento',tab:'docs',tit:d.titulo,extra:d.assinT?'assinado':''});
  for(const a of (p.anexos||[]))ev.push({d:a.data,h:'',tipo:'Anexo',tab:'anexos',tit:a.desc||a.nome,extra:a.regiao||''});
  ev.sort((a,b)=>(b.d+b.h).localeCompare(a.d+a.h));
  let mes='',html='';
  for(const e of ev){const m=String(e.d).slice(0,7);if(m!==mes){mes=m;html+=`<h3 class="dayh">${new Date(m+'-15T12:00:00').toLocaleDateString('pt-BR',{month:'long',year:'numeric'})}</h3>`}
    html+=`<button class="tl" data-tab="${esc(e.tab)}"><span class="tld">${br(e.d).slice(0,5)}${e.h?'<br>'+esc(e.h):''}</span><span><b>${esc(e.tipo)}:</b> ${esc(e.tit)}${e.extra?`<br><span class="meta">${esc(String(e.extra).slice(0,140))}</span>`:''}</span></button>`}
  return `<div class="bar"><h3>Linha do tempo</h3><span class="meta">${ev.length} registro(s)</span></div><p class="hint">Tudo o que aconteceu com ${esc(p.nome)}, do mais recente para o mais antigo. Toque para abrir.</p>${ev.length?`<div class="tlw">${html}</div>`:'<div class="empty"><p>Nenhum registro ainda.</p></div>'}`;
}
/* agenda para o calendário do celular (.ics) */
function icsAgenda(){
  const its=S.pac.filter(p=>p.status!=='obito').flatMap(pendencias).filter(x=>dias(x.d)>=-1&&dias(x.d)<=90&&x.tab!=='fin');
  const e=s=>String(s||'').replace(/[\\;,]/g,m=>'\\'+m).replace(/\n/g,'\\n');
  const dt=(d,h)=>d.replace(/-/g,'')+(h?'T'+h.replace(':','')+'00':'');
  const fim=(d,h)=>{if(h){const[hh,mm]=h.split(':').map(Number);const t=new Date(2000,0,1,hh,mm+60);return d.replace(/-/g,'')+'T'+String(t.getHours()).padStart(2,'0')+String(t.getMinutes()).padStart(2,'0')+'00'}return addD(d,1).replace(/-/g,'')};
  const ev=its.map((x,i)=>['BEGIN:VEVENT',`UID:vetcamp-${x.p.id}-${i}-${x.d}@vetcamp.web.app`,`DTSTAMP:${new Date().toISOString().replace(/[-:]/g,'').slice(0,15)}Z`,x.h?`DTSTART:${dt(x.d,x.h)}`:`DTSTART;VALUE=DATE:${dt(x.d)}`,x.h?`DTEND:${fim(x.d,x.h)}`:`DTEND;VALUE=DATE:${fim(x.d)}`,`SUMMARY:${e(x.p.nome+' · '+x.txt)}`,`DESCRIPTION:${e([x.p.tutor,x.p.prop,x.p.tel].filter(Boolean).join(' · '))}`,'END:VEVENT'].join('\r\n'));
  return {n:its.length,txt:['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//VetCamp//Agenda//PT-BR','CALSCALE:GREGORIAN','X-WR-CALNAME:VetCamp',...ev,'END:VCALENDAR'].join('\r\n')};
}

/* cobranças esquecidas */
function semCobranca(dd=60){
  const out=[];for(const p of S.pac)for(const m of MODS){if(SEMVALOR.includes(m.key)||m.key==='evolucao')continue;for(const it of (p[m.key]||[])){const d=it[m.dateK||'data'];if(!d||dias(d)<-dd||dias(d)>0)continue;if(!valorItem(m,it)&&!it.semCobranca)out.push({p,m,it,d})}}
  return out.sort((a,b)=>b.d.localeCompare(a.d));
}
function esquecidasHtml(){const l=semCobranca();if(!l.length)return '';
  return `<div class="box"><div class="bar"><h3>Atendimentos sem cobrança</h3><span class="meta">últimos 60 dias</span></div><p class="hint" style="margin:0 0 8px">Registros sem valor lançado. Confira se não ficou nada por cobrar. Se foi cortesia, marque como "sem cobrança".</p>

function resumo(p){

  const g=gestacao(p),meds=(p.meds||[]).filter(medAtiva),pend=pendencias(p).sort((a,b)=>a.d.localeCompare(b.d)).slice(0,6);

  ${alertas(p).map(a=>`<div class="alert"><b>${esc(a)}</b></div>`).join('')}
  ${car.map(x=>`<div class="alert">${x.tipo==='leite'?'Leite em carência':'Em carência (abate / competição)'} de <b>${esc(x.med)}</b> até ${br(x.ate)}${x.tipo==='leite'?' · não usar o leite':''}</div>`).join('')}
  ${g?`<div class="info"><b>Prenhe</b> · parto previsto ${br(g.parto)} (${quando(g.parto)})</div>`:''}
  ${deb?`<div class="info">Saldo em aberto: <b>${R$(deb)}</b> <button class="btn sm" data-tab="fin">Ver financeiro</button></div>`:''}
  ${spOk('gr',p)&&Object.keys(ofi).length?`<div class="chips">${Object.values(ofi).map(x=>{const v=x.resultado==='Negativo'&&x.data&&+x.val?addD(x.data,+x.val):null;const c=x.resultado==='Positivo'?'internado':!v?'obito':dias(v)<0?'internado':dias(v)<=10?'tratamento':'alta';return`<span class="pill" style="--c:var(--s-${c})">${esc(x.tipo.split(' (')[0])}: ${esc(x.resultado)}${v?' · até '+br(v):''}</span>`}).join('')}</div>`:''}
  <div class="bar"><h3>Último exame${u.data?' · '+br(u.data):''}</h3><div class="btns">${STANDALONE&&db?'<button class="btn sm" data-linkcli>Link para o cliente</button>':''}<button class="btn sm" data-orcpac>Orçamento</button><button class="btn sm" data-protapl>Aplicar protocolo</button><button class="btn sm" data-add="agend">Agendar</button><button class="btn pri sm" data-add="consultas">+ Nova consulta</button></div></div>
  ${u.data?`<div class="grid">${vit.map(([l,v,un,k])=>`<div class="vit${out(k,v)?' out':''}"><span>${l}</span><b>${v?esc(v)+(un?' '+un:''):'—'}</b>${k&&R[k]?`<small>ref. ${R[k][0]}–${R[k][1]}</small>`:''}</div>`).join('')}</div>`:'<div class="empty"><p>Nenhuma consulta registrada.</p></div>'}
  ${u.diag?`<div class="box"><span class="lbl">Diagnóstico atual</span><p>${esc(u.diag)}</p>${u.trat?`<span class="lbl">Tratamento</span><p>${esc(u.trat)}</p>`:''}</div>`:''}

const fmt=(f,v)=>f.k==='resp'?(nomeMembro(membroPor(v))||'—'):f.k==='clienteId'?((S.cli.find(c=>c.id===v)||{}).nome||'—'):Array.isArray(v)?v.join(', '):f.t==='date'?br(v):v;
const vazio=v=>v===undefined||v===null||v===''||(Array.isArray(v)&&!v.length);
function modulo(m,p){
  const fs=campos(m.f,p).filter(f=>f.k),dk=m.dateK||'data';
  const l=ord(p[m.key],dk);
  let topo='';
  if(m.key!=='fin'&&!SEMVALOR.includes(m.key)){const ids=new Set(l.map(x=>x.id)),fl=(p.fin||[]).filter(f=>f.ref&&(ids.has(f.ref)||ids.has(String(f.ref).replace(/-km$/,''))));if(fl.length)topo=`<p class="info">Subtotal de ${esc(m.tab)}: <b>${R$(fl.reduce((s,f)=>s+num(f.total),0))}</b>${fl.some(f=>saldo(f))?` · em aberto <b class="late">${R$(fl.reduce((s,f)=>s+saldo(f),0))}</b>`:''}</p>`}
  if(m.key==='consultas'&&l.length)topo+=`<div class="btns" style="margin-bottom:10px"><button class="btn sm" data-repetir>Repetir última consulta</button></div>`;

/* ---------- notificações com o app fechado (push) e pedido de autorização ---------- */
/* O aparelho recebe um código (token) do Firebase Cloud Messaging. A agenda dos próximos dias fica em notif/<conta>;
   um robô de hora em hora (GitHub Actions) manda o aviso no horário escolhido, mesmo com o VetCamp fechado. */
const PUSH_CFG=()=>(window.SAMVET_FIREBASE||{});
const pushPossivel=()=>STANDALONE&&!!db&&!!meId()&&'Notification' in window&&'serviceWorker' in navigator&&!!(window.firebase&&firebase.messaging)&&!!PUSH_CFG().vapidKey;

async function sincronizarPush(porDia){
  if(!pushPossivel()||Notification.permission!=='granted'||!notifCfg().on)return false;
  try{
    const reg=await Promise.race([navigator.serviceWorker.ready,new Promise(ok=>setTimeout(()=>ok(null),4000))]);if(!reg)return false;
    let tok=LS.get('vetcamp-push-token',null);
    if(!tok||Date.now()-(tok.em||0)>7*864e5){const t=await firebase.messaging().getToken({vapidKey:PUSH_CFG().vapidKey,serviceWorkerRegistration:reg});if(!t)return false;tok={t,em:Date.now()};LS.set('vetcamp-push-token',tok)}
    const c=notifCfg(),ref=db.doc('notif/'+meId());
    const corpo={on:true,hora:num(c.hora),dia:!!c.dia,motiv:!!c.motiv,perfil:MODO,tz:Intl.DateTimeFormat().resolvedOptions().timeZone||'America/Sao_Paulo',porDia:porDia||{}};
    const assin=JSON.stringify([corpo,tok.t]);if(LS.get('vetcamp-push-assin','')===assin&&pushAtivo())return true;
    const atual=await ref.get().then(s=>s.exists?s.data():{}).catch(()=>({}));
    const toks=[{t:tok.t,em:Date.now(),disp:(ehIOS()?'iPhone/iPad':/Android/.test(navigator.userAgent)?'Android':'Computador')},...(Array.isArray(atual.tokens)?atual.tokens:[]).filter(x=>x&&x.t!==tok.t)].slice(0,5);
    await ref.set({...corpo,tokens:toks,atualizado:Date.now()},{merge:true});
    LS.set('vetcamp-push-assin',assin);LS.set('vetcamp-push-ok',1);return true;
  }catch(e){return false}
}

function desenhaPeso(s,p){
  const pts=ult(p).filter(c=>c.peso).reverse().map(c=>({d:c.data,v:+c.peso}));
  const draw=()=>{const W=s.clientWidth,H=s.clientHeight,pad=28;if(!W)return;const vs=pts.map(x=>x.v),mn=Math.min(...vs),mx=Math.max(...vs),r=mx-mn||1;
    const X=i=>pad+i*(W-pad*2)/(pts.length-1),Y=v=>H-pad-(v-mn)/r*(H-pad*2);
    s.innerHTML=`<polyline fill="none" stroke="var(--brand)" stroke-width="3" points="${pts.map((x,i)=>X(i)+','+Y(x.v)).join(' ')}"/>`+pts.map((x,i)=>`<circle cx="${X(i)}" cy="${Y(x.v)}" r="5" fill="var(--act)"/>${W>520||i===0||i===pts.length-1?`<text x="${X(i)}" y="${Y(x.v)-10}" text-anchor="middle" font-size="13" fill="var(--ink)">${esc(x.v)}</text><text x="${X(i)}" y="${H-6}" text-anchor="middle" font-size="12" fill="var(--mute)">${esc(br(x.d).slice(0,5))}</text>`:''}`).join('')};
  const ro=new ResizeObserver(draw);ro.observe(s);
}

/* backup importado: tira chaves perigosas, limita tamanho de textos e profundidade */
function limparImport(v,nivel=0){
  if(nivel>8)return null;
  if(typeof v==='string')return v.length>200000?v.slice(0,200000):v;
  if(typeof v==='number')return isFinite(v)?v:0;
  if(typeof v==='boolean'||v===null)return v;
  if(Array.isArray(v))return v.slice(0,20000).map(x=>limparImport(x,nivel+1));
  if(typeof v==='object'){const o={};for(const k of Object.keys(v).slice(0,400)){if(k==='__proto__'||k==='constructor'||k==='prototype'||k.length>100)continue;o[k]=limparImport(v[k],nivel+1)}return o}
  return null;
}

  setInterval(()=>{if(idle()&&['pac','agenda','intern'].includes(S.vis)||S.sel&&idle())render();if(pendentes().length&&navigator.onLine)reenviar()},60000);
  addEventListener('online',()=>{avisoPend();reenviar()});addEventListener('offline',avisoPend);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden&&pendentes().length)reenviar()});
  addEventListener('beforeunload',e=>{if(pendentes().length){e.preventDefault();e.returnValue=''}});
  setInterval(()=>{if(pendentes().length&&navigator.onLine)reenviar()},15000);avisoPend();
  reenviar();setTimeout(carregarConvites,1500);
})();
